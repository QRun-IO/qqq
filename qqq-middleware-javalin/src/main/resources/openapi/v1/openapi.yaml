                    scriptRevisionId: 13
                    scriptRevisionSequenceNo: 3
              schema:
                $ref: "#/components/schemas/RecordAssociatedScriptStoreResponseV1"
          description: "The script, and the revision that was stored"
      security:
      - sessionUuidCookie:
        - "N/A"
      summary: "Store a new revision of a record's associated script (developer mode)"
      tags:
      - "Tables"
