        example: "person"
        in: "path"
        name: "tableName"
        required: true
        schema:
          type: "string"
      - description: "Primary key value of the record to get."
        example: "42"
        in: "path"
        name: "primaryKey"
        required: true
        schema:
          type: "string"
      - description: "Whether or not to include associated records."
        example: "true"
        in: "query"
        name: "includeAssociations"
        required: false
        schema:
          type: "boolean"
      - description: "JSON array of QueryJoin objects specifying tables to join into\
          \ the get."
        example: "[{\"joinTable\":\"orderLine\",\"select\":true}]"
        in: "query"
        name: "queryJoins"
        required: false
        schema:
          type: "string"
      - description: "For tables that use variant backends, JSON object naming the\
          \ variant to read from (the same `type` and `id` as in query requests)."
        example: "{\"type\":\"store\",\"id\":\"1\"}"
        in: "query"
        name: "tableVariant"
        required: false
        schema:
          type: "string"
      responses:
        200:
          content:
            application/json:
              examples:
                TODO:
                  value:
                    record:
                      displayValues:
