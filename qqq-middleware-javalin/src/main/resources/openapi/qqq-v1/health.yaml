components:
  schemas:
    BasicErrorResponseV1:
      description: "The error body of every UI API operation (core and extensions)."
      properties:
        error:
          description: "The error message (the same as message; kept for clients of\
            \ UI API 1.0 to 1.5)."
          type: "string"
        code:
          description: "A stable, machine-readable code. Well-known values: BAD_REQUEST\
            \ (400), UNAUTHENTICATED (401),\nPERMISSION_DENIED (403), NOT_FOUND (404),\
            \ CONFLICT (409), RATE_LIMITED (429), INTERNAL_ERROR (500),\nERROR (other).\
            \ Extensions may add codes; treat an unknown code by the HTTP status.\
            \ Since 1.6.0."
          type: "string"
        message:
          description: "A message to show the user. Since 1.6.0."
          type: "string"
        fieldErrors:
          description: "Errors about particular request fields, when known. Since\
            \ 1.6.0."
          items:
            properties:
              field:
                description: "The field (or parameter) name."
                type: "string"
              message:
                description: "The error about that field."
                type: "string"
              code:
                description: "An optional machine-readable code, e.g. REQUIRED, TOO_LONG,\
                  \ PATTERN."
                type: "string"
            type: "object"
          type: "array"
        traceId:
          description: "Identifies this request in the server logs (also the X-QQQ-Trace-Id\
            \ response header); quote it when reporting a problem. Since 1.6.0."
          type: "string"
      type: "object"
    HealthCheckV1:
      properties:
        name:
          nullable: true
          type: "string"
        label:
          nullable: true
          type: "string"
        kind:
          nullable: true
          type: "string"
        severity:
          nullable: true
          type: "string"
        currentStatus:
          nullable: true
          type: "string"
        currentMessage:
          nullable: true
          type: "string"
        currentSince:
          nullable: true
          type: "string"
        lastRunAt:
          nullable: true
          type: "string"
        lastLatencyMs:
          nullable: true
          type: "integer"
      type: "object"
    HealthComponentV1:
      properties:
        name:
          nullable: true
          type: "string"
        label:
          nullable: true
          type: "string"
        status:
          nullable: true
          type: "string"
        since:
          nullable: true
          type: "string"
        checksUp:
          nullable: true
          type: "integer"
        checksDegraded:
          nullable: true
          type: "integer"
        checksDown:
          nullable: true
          type: "integer"
        checksUnknown:
          nullable: true
          type: "integer"
        worstCheckId:
          nullable: true
          type: "integer"
        updatedAt:
          nullable: true
          type: "string"
        checks:
          items:
            $ref: "#/components/schemas/HealthCheckV1"
          type: "array"
      type: "object"
    HealthCountsV1:
      properties:
        up:
          nullable: true
          type: "integer"
        degraded:
          nullable: true
          type: "integer"
        down:
          nullable: true
          type: "integer"
        unknown:
          nullable: true
          type: "integer"
      type: "object"
    HealthDetailsV1:
      properties:
        values:
          additionalProperties: true
          type: "object"
      type: "object"
    HealthHistoryV1:
      properties:
        results:
          items:
            $ref: "#/components/schemas/HealthResultV1"
          type: "array"
      type: "object"
    HealthMetricV1:
      properties:
        name:
          nullable: true
          type: "string"
        value:
          type: "number"
        unit:
          nullable: true
          type: "string"
      type: "object"
    HealthResultV1:
      properties:
        id:
          nullable: true
          type: "integer"
        status:
          nullable: true
          type: "string"
        message:
          nullable: true
          type: "string"
        detailsJson:
          nullable: true
          type: "string"
        metricsJson:
          nullable: true
          type: "string"
        latencyMs:
          nullable: true
          type: "integer"
        startedAt:
          nullable: true
          type: "string"
        finishedAt:
          nullable: true
          type: "string"
        runnerPod:
          nullable: true
          type: "string"
        isTransition:
          type: "boolean"
        triggeredBy:
          nullable: true
          type: "string"
      type: "object"
    HealthRunV1:
      properties:
        status:
          nullable: true
          type: "string"
        message:
          nullable: true
          type: "string"
        details:
          $ref: "#/components/schemas/HealthDetailsV1"
        latencyMs:
          nullable: true
          type: "integer"
        metrics:
          items:
            $ref: "#/components/schemas/HealthMetricV1"
          type: "array"
      type: "object"
    HealthRunnerV1:
      properties:
        lastBeatAt:
          nullable: true
          type: "string"
        pods:
          items:
            nullable: true
            type: "string"
          type: "array"
      type: "object"
    HealthSummaryV1:
      properties:
        status:
          nullable: true
          type: "string"
        since:
          nullable: true
          type: "string"
        counts:
          $ref: "#/components/schemas/HealthCountsV1"
        components:
          items:
            $ref: "#/components/schemas/HealthComponentV1"
          type: "array"
        runner:
          $ref: "#/components/schemas/HealthRunnerV1"
      type: "object"
  securitySchemes:
    sessionUuidCookie:
      description: "The session cookie set by POST /qqq/v1/manageSession (web clients)."
      in: "cookie"
      name: "sessionUUID"
      type: "apiKey"
    bearerAuth:
      bearerFormat: "JWT or session UUID"
      description: "`Authorization: Bearer <token>`, where the token is either\n-\
        \ an OAuth2 access token (a signed JWT) issued by the app's identity provider\
        \ to the app's client,\n  or to its native client (`values.nativeClientId`\
        \ in GET /qqq/v1/metaData/authentication), for\n  example from the device-authorization\
        \ grant or auth-code + PKCE. It is verified against the\n  provider's keys\
        \ (issuer, audience, expiry, signature) and gives the same user and permissions\n\
        \  as signing in on the web. When it expires (401), refresh it at the provider\
        \ and retry; or\n- a session UUID returned by POST /qqq/v1/manageSession,\
        \ which the server keeps refreshed."
      scheme: "bearer"
      type: "http"
    oauth2:
      description: "The app's OAuth2 / OpenID Connect provider. The real endpoints\
        \ come from the provider's discovery\ndocument: `{values.baseUrl}.well-known/openid-configuration`,\
        \ with values from\nGET /qqq/v1/metaData/authentication. Native clients use\
        \ `values.nativeClientId` (a public client)\nwith auth-code + PKCE (loopback\
        \ or custom-scheme redirect URI registered at the provider) or the\ndevice-authorization\
        \ grant (`device_authorization_endpoint`, RFC 8628), then send the access\
        \ token\nas `Authorization: Bearer`."
      flows:
        authorizationCode:
          authorizationUrl: "/authorize"
          scopes:
            email: "Email address"
            offline_access: "A refresh token, to renew the access token without signing\
              \ in again"
            openid: "OpenID Connect sign-in"
            profile: "Name, username and groups (permissions come from the groups)"
          tokenUrl: "/token"
      type: "oauth2"
info:
  contact:
    email: "contact@kingsrook.com"
  description: "Central health summary, components, history and on-demand checks."
  title: "QQQ Middleware API extension: health"
  version: "1.1.0"
openapi: "3.0.3"
paths:
  /qqq/v1/health/summary:
    get:
      description: "Requires health.read permission. Returns redacted health state."
      operationId: "getHealthSummary"
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthSummaryV1"
          description: "Successful Response"
        400:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Bad request: a parameter or the body is invalid (code BAD_REQUEST);\
            \ fieldErrors may name the fields."
        401:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Not authenticated, or the session or token is invalid or expired\
            \ (code UNAUTHENTICATED). Sign in again, or refresh the token."
        403:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "The user (or the credential's scope) may not do this (code\
            \ PERMISSION_DENIED)."
        404:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Not found, or not visible to this user (code NOT_FOUND)."
        409:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Conflict with the current state, e.g. an edit conflict or\
            \ an invalid transition (code CONFLICT)."
        429:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Too many requests (code RATE_LIMITED); retry later."
      security:
      - sessionUuidCookie:
        - "N/A"
      - bearerAuth:
        - "N/A"
      - oauth2:
        - "openid"
        - "profile"
        - "email"
      summary: "Health summary"
      tags:
      - "Health"
  /qqq/v1/health/components/{name}:
    get:
      description: "Requires health.read permission. Returns redacted health state."
      operationId: "getHealthComponentsByName"
      parameters:
      - description: "Stable health check or component name."
        in: "path"
        name: "name"
        required: true
        schema:
          type: "string"
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthComponentV1"
          description: "Successful Response"
        400:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Bad request: a parameter or the body is invalid (code BAD_REQUEST);\
            \ fieldErrors may name the fields."
        401:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Not authenticated, or the session or token is invalid or expired\
            \ (code UNAUTHENTICATED). Sign in again, or refresh the token."
        403:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "The user (or the credential's scope) may not do this (code\
            \ PERMISSION_DENIED)."
        404:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Not found, or not visible to this user (code NOT_FOUND)."
        409:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Conflict with the current state, e.g. an edit conflict or\
            \ an invalid transition (code CONFLICT)."
        429:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Too many requests (code RATE_LIMITED); retry later."
      security:
      - sessionUuidCookie:
        - "N/A"
      - bearerAuth:
        - "N/A"
      - oauth2:
        - "openid"
        - "profile"
        - "email"
      summary: "Health component"
      tags:
      - "Health"
  /qqq/v1/health/checks/{name}/history:
    get:
      description: "Requires health.read permission. Returns redacted health state."
      operationId: "getHealthChecksByNameHistory"
      parameters:
      - description: "Stable health check or component name."
        in: "path"
        name: "name"
        required: true
        schema:
          type: "string"
      - description: "limit is capped at 500; from/to are inclusive ISO-8601 instants."
        in: "query"
        name: "from"
        required: false
        schema:
          type: "string"
      - description: "limit is capped at 500; from/to are inclusive ISO-8601 instants."
        in: "query"
        name: "to"
        required: false
        schema:
          type: "string"
      - description: "limit is capped at 500; from/to are inclusive ISO-8601 instants."
        in: "query"
        name: "limit"
        required: false
        schema:
          type: "integer"
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthHistoryV1"
          description: "Successful Response"
        400:
          content:
            application/json:
