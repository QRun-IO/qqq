        \ actions target only rows loaded for that user and allowed by actionNames.\
        \ Unknown actions or hidden sections return 404; invalid inputs return 400;\
        \ unauthenticated requests return 401. Clients must confirm confirmationText\
        \ before running. Secrets are shown once and must not be stored, logged, cached,\
        \ or sent to analytics by clients. Responses use Cache-Control: no-store."
