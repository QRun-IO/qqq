    VersionResponseV1:
      properties:
        apiVersion:
          description: "Semantic version (MAJOR.MINOR.PATCH) of the UI API this server\
            \ implements. MAJOR matches the URL version (v1). A client built against\
            \ 1.x works with any server 1.y where y >= x."
