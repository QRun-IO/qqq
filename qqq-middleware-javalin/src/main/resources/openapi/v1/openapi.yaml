      summary: "Get a record's developer panels"
      tags:
      - "Tables"
  /qqq/v1/table/{tableName}/{primaryKey}/developer/associatedScript/{fieldName}:
    post:
      description: "Save new contents for the script that a record references in one\
        \ of its table's associated script\nfields, as a new revision of that script.\
        \  If the record does not yet reference a script, one is\ninserted (and the\
        \ record is updated to reference it).\n\nRequires permission to edit records\
        \ in the table."
      parameters:
      - description: "Name of the table that the record is in."
        example: "person"
        in: "path"
        name: "tableName"
        required: true
        schema:
          type: "string"
      - description: "Primary key value of the record."
        example: "42"
        in: "path"
        name: "primaryKey"
        required: true
        schema:
          type: "string"
      - description: "Name of the associated script field (in the table) whose script\
          \ is being stored."
        example: "greetingScriptId"
        in: "path"
        name: "fieldName"
        required: true
        schema:
          type: "string"
      requestBody:
        content:
          application/json:
            schema:
              properties:
                contents:
                  description: "The script's new contents (its code)."
                  example: "return (\"Hello, \" + input.getName());"
                  type: "string"
                commitMessage:
                  description: "A message describing the change.  If not given, a\
                    \ default message is used."
                  example: "Say hello by name"
                  type: "string"
              type: "object"
        required: false
      responses:
        200:
          content:
            application/json:
              examples:
