  /qqq/v1/{applicationApiPath}/{applicationApiVersion}/processes/{processName}/{processUUID}/records:
    get:
      description: "Retrieve the records associated with a running or completed process,\
        \ with support\nfor pagination via skip and limit query parameters."
      parameters:
      - description: "Name of the process"
        example: "samplePersonProcess"
        in: "path"
        name: "processName"
        required: true
        schema:
          type: "string"
      - description: "Unique identifier for this run of the process"
        example: "01234567-89AB-CDEF-0123-456789ABCDEF"
        in: "path"
        name: "processUUID"
        required: true
        schema:
          format: "uuid"
          type: "string"
      - description: "Number of records to skip (default 0)"
        example: "0"
        in: "query"
        name: "skip"
        required: false
        schema:
          type: "integer"
      - description: "Maximum number of records to return (default 20)"
        example: "20"
        in: "query"
        name: "limit"
        required: false
        schema:
          type: "integer"
      - description: "For processes on tables that use variant backends, JSON object\
          \ naming the variant to use (the same `type` and `id` as in table requests)."
        example: "{\"type\":\"store\",\"id\":\"1\"}"
        in: "query"
        name: "tableVariant"
        required: false
        schema:
          type: "string"
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessRecordsResponseV1"
          description: "Paginated list of records from the process state."
      security:
      - sessionUuidCookie:
        - "N/A"
      summary: "Get records from a process"
      tags:
      - "Processes"
  /qqq/v1/{applicationApiPath}/{applicationApiVersion}/processes/{processName}/{processUUID}/cancel:
    post:
      description: "Cancel a running process. If the process defines a cancel step,\
        \ it will be executed."
      parameters:
      - description: "Name of the process to cancel"
        example: "samplePersonProcess"
        in: "path"
        name: "processName"
        required: true
        schema:
          type: "string"
      - description: "Unique identifier for this run of the process"
        example: "01234567-89AB-CDEF-0123-456789ABCDEF"
        in: "path"
        name: "processUUID"
        required: true
        schema:
          format: "uuid"
          type: "string"
      - description: "For processes on tables that use variant backends, JSON object\
          \ naming the variant to use (the same `type` and `id` as in table requests)."
        example: "{\"type\":\"store\",\"id\":\"1\"}"
        in: "query"
        name: "tableVariant"
        required: false
        schema:
          type: "string"
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessCancelResponseV1"
          description: "Empty JSON object indicating successful cancellation."
      security:
      - sessionUuidCookie:
        - "N/A"
      summary: "Cancel a running process"
      tags:
      - "Processes"
  /qqq/v1/{applicationApiPath}/{applicationApiVersion}/processes/{processName}/jobs:
    post:
      description: "Launch an eligible process as a durable job: it survives pod restarts,\
        \ runs in checkpointed chunks under leases, and can be paused, resumed, cancelled,\
        \ restarted and retried with the job control processes on the jobs_job table.\
        \ Values for the process's frontend steps are given up front. The job runs\
        \ with the caller's permissions (never more). A launch from the assistant\
        \ client channel waits for confirmation (status AWAITING_CONFIRMATION). Progress\
        \ arrives as job.progress and job.status events on the realtime channel record:jobs_job:{jobId}."
      parameters:
      - description: "Name of the process to run as a job"
        example: "person.bulkEdit"
        in: "path"
        name: "processName"
        required: true
        schema:
          type: "string"
      requestBody:
        content:
          application/json:
            schema:
              description: "The launch request."
              properties:
                values:
                  description: "Process values (what the frontend steps would have\
                    \ collected)."
                  type: "object"
                filter:
                  description: "A records filter (QQueryFilter JSON) the process runs\
                    \ over."
                  type: "object"
                recordIds:
                  description: "Primary keys the process runs over."
                  items:
                    type: "string"
                  type: "array"
                uploadRefs:
                  description: "Upload refs from POST /uploads."
                  items:
                    type: "string"
                  type: "array"
                savedBulkLoadProfileId:
                  description: "A saved bulk load profile to load with."
                  type: "integer"
                profile:
                  description: "A bulk load profile (BulkLoadProfile v1 JSON) to load\
                    \ with."
                  type: "object"
                mode:
                  description: "EXECUTE (default) or VALIDATE (no store)."
                  enum:
                  - "EXECUTE"
                  - "VALIDATE"
                  type: "string"
                priority:
                  description: "0-9, default 5 (higher runs first)."
                  type: "integer"
                notifyEmail:
                  description: "Email the owner when the job finishes."
                  type: "boolean"
                label:
                  description: "A label for the job (defaults to the process label)."
                  type: "string"
                startAfterStep:
                  description: "The launch point: backend steps after this step run\
                    \ in the job."
                  type: "string"
                expectedRows:
                  description: "A known row count (e.g., from a count)."
                  type: "integer"
              type: "object"
        required: false
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessJobLaunchResponseV1"
          description: "The new job's id and status."
        429:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Too many jobs are waiting for this user (or for the assistant)."
      security:
      - sessionUuidCookie:
        - "N/A"
      summary: "Run a process as a durable background job"
      tags:
      - "Processes"
  /qqq/v1/{applicationApiPath}/{applicationApiVersion}/uploads:
    post:
      description: "Streams a file into the application's uploads storage and returns\
        \ an opaque, expiring ref bound to the caller. Pass the ref in uploadRefs\
        \ when launching a job (POST /processes/{processName}/jobs). Send multipart\
        \ form data with one file field, or the raw file as the request body with\
        \ the fileName query parameter."
      parameters:
      - description: "The file's name, when the body is the raw file (not multipart)."
        example: "people.csv"
        in: "query"
        name: "fileName"
        required: false
        schema:
          type: "string"
      requestBody:
        content:
          multipart/form-data:
            schema:
              description: "One file field."
              properties:
                file:
                  description: "The file."
                  format: "binary"
                  type: "string"
              type: "object"
          application/octet-stream:
            schema:
              description: "The raw file (give its name in the fileName query parameter)."
              format: "binary"
              type: "string"
        required: false
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadRefResponseV1"
          description: "The upload's ref, name, size, content type and expiry."
      security:
      - sessionUuidCookie:
        - "N/A"
      summary: "Upload a file for a job or a bulk load"
      tags:
      - "Processes"
  /qqq/v1/{applicationApiPath}/{applicationApiVersion}/table/{tableName}/export:
    post:
      description: "Export records from a table as a downloadable file in the specified\
        \ format (CSV, XLSX, JSON, TSV)."
      parameters:
      - description: "Name of the table to export."
        example: "person"
        in: "path"
        name: "tableName"
        required: true
        schema:
          type: "string"
      requestBody:
        content:
          application/json:
            schema:
              properties:
                format:
                  description: "Export format: csv, xlsx, json, tsv"
                  type: "string"
                filename:
                  description: "Optional filename for the download. Generated if absent."
                  type: "string"
                filter:
                  $ref: "#/components/schemas/QueryFilter"
                  description: "QueryFilter to specify matching records to export"
                fieldNames:
                  description: "Optional subset of field names to include in the export"
                  items:
                    type: "string"
                  type: "array"
                limit:
                  description: "Optional maximum number of records to export"
                  type: "integer"
                includeHeaderRow:
                  description: "Whether to include a header row (default true)"
                  type: "boolean"
                tableVariant:
                  $ref: "#/components/schemas/TableVariant"
                  description: "For tables that use variant backends, the variant\
                    \ to export from (the same `type` and `id` as in query requests)."
              type: "object"
        required: false
      responses:
        200:
          content:
            application/octet-stream:
              schema:
                format: "binary"
                type: "string"
          description: "Binary file content in the requested export format"
      security:
      - sessionUuidCookie:
        - "N/A"
      summary: "Export records from a table"
      tags:
      - "Tables"
  /qqq/v1/{applicationApiPath}/{applicationApiVersion}/table/{tableName}/{primaryKey}/{fieldName}/{filename}:
    get:
      description: "Download the binary content of a blob field from a specific record."
      parameters:
      - description: "Name of the table containing the record."
        example: "person"
        in: "path"
        name: "tableName"
        required: true
        schema:
          type: "string"
      - description: "Primary key value of the record."
        example: "42"
        in: "path"
        name: "primaryKey"
        required: true
        schema:
          type: "string"
      - description: "Name of the field to download."
        example: "photo"
        in: "path"
        name: "fieldName"
        required: true
        schema:
          type: "string"
      - description: "Filename for the downloaded content."
        example: "photo.jpg"
        in: "path"
        name: "filename"
        required: true
        schema:
          type: "string"
      responses:
        200:
          content:
            application/octet-stream:
              schema:
                format: "binary"
                type: "string"
          description: "Binary file content"
      security:
      - sessionUuidCookie:
        - "N/A"
      summary: "Download a field value from a record"
      tags:
      - "Tables"
  /qqq/v1/{applicationApiPath}/{applicationApiVersion}/download/{file}:
    get:
      description: "Download a file from server-side storage by file path or storage\
        \ table reference."
      parameters:
      - description: "Filename for the download."
        example: "report.csv"
        in: "path"
        name: "file"
        required: true
        schema:
          type: "string"
      - description: "Server-side file path to download from."
        in: "query"
        name: "filePath"
        required: false
        schema:
          type: "string"
      - description: "Name of the storage table to download from."
        in: "query"
        name: "storageTableName"
        required: false
        schema:
          type: "string"
      - description: "Storage reference key for the file."
        in: "query"
        name: "storageReference"
        required: false
        schema:
          type: "string"
      responses:
        200:
          content:
            application/octet-stream:
              schema:
                format: "binary"
                type: "string"
          description: "Binary file content"
      security:
      - sessionUuidCookie:
        - "N/A"
      summary: "Download a file"
      tags:
      - "General"
  /qqq/v1/{applicationApiPath}/{applicationApiVersion}/reports/{reportName}:
    get:
      description: "Run a report and stream the generated file in the requested format.\
        \  The report's input fields are given as\nquery parameters named for the\
        \ fields; a missing required input is a 400.  Requires permission to run the\
        \ report."
      parameters:
      - description: "Name of the report to run."
        example: "personReport"
        in: "path"
        name: "reportName"
        required: true
        schema:
          type: "string"
      - description: "Output format: csv, xlsx, json (as for table export)."
        example: "csv"
        in: "query"
        name: "format"
        required: true
        schema:
          type: "string"
      responses:
        200:
          content:
            application/octet-stream:
              schema:
                format: "binary"
                type: "string"
          description: "The generated report file, in the requested format"
      security:
      - sessionUuidCookie:
        - "N/A"
      summary: "Run a report and download the file"
      tags:
      - "Reports"
  /qqq/v1/{applicationApiPath}/{applicationApiVersion}/bulkLoad/uploads/{uploadRef}/profile:
    get:
      description: "Read an uploaded file (by its upload ref, which must be the session\
        \ user's) and describe it for a bulk load into a table: whether row 1 is a\
        \ header row, and each column's inferred type, percent blank, distinct count,\
        \ maximum length and pattern class.  Sample values are included only for columns\
        \ mapped to an unclassified (or PUBLIC) field, or for every column when the\
        \ request's `X-QQQ-AI-Route` header is `hipaa`; unmapped columns never get\
        \ samples otherwise.  Requires the table's bulk-insert process permission.\
        \  Nothing is stored."
      parameters:
      - description: "The opaque ref of an upload the session user owns."
        in: "path"
        name: "uploadRef"
        required: true
        schema:
          type: "string"
      - description: "The table the file would be loaded into."
        example: "person"
        in: "query"
        name: "tableName"
        required: true
        schema:
          type: "string"
      - description: "Sample values per column, where allowed (0 to 20; default 5)."
        in: "query"
        name: "sampleCount"
        required: false
        schema:
          type: "integer"
      responses:
        200:
          content:
            application/json:
              examples:
                profile:
                  value:
                    fileName: "people.csv"
                    hasHeaderRow: true
                    rowsProfiled: 250
                    uploadRef: "u_4f2c"
              schema:
                $ref: "#/components/schemas/BulkLoadUploadProfileResponseV1"
          description: "The upload's header guess and column profiles"
      security:
      - sessionUuidCookie:
        - "N/A"
      summary: "Profile an uploaded file for a bulk load"
      tags:
      - "Bulk Load"
  /qqq/v1/{applicationApiPath}/{applicationApiVersion}/bulkLoad/{tableName}/suggestMapping:
    post:
      description: "Run the bulk load mapping suggester over an uploaded file's header\
        \ row and return a v1 bulk load profile, the file columns it leaves unmapped,\
        \ the required fields it does not fill, and the mapped fields with a possible\
        \ value source (whose file values may need value mapping).  The upload must\
        \ be the session user's.  Requires the table's bulk-insert process permission.\
        \  Nothing is stored."
      parameters:
      - description: "The table the file would be loaded into."
        example: "person"
        in: "path"
        name: "tableName"
        required: true
        schema:
          type: "string"
      requestBody:
        content:
          application/json:
            schema:
              properties:
                uploadRef:
                  description: "The opaque ref of an upload the session user owns."
                  type: "string"
                isBulkEdit:
                  description: "Suggest a bulk edit profile (default false: bulk insert)."
                  type: "boolean"
              type: "object"
        required: false
      responses:
        200:
          content:
            application/json:
              examples:
                suggestion:
                  value:
                    profile:
                      version: "v1"
                      layout: "FLAT"
                      hasHeaderRow: true
              schema:
                $ref: "#/components/schemas/BulkLoadSuggestMappingResponseV1"
          description: "The suggested profile and what it leaves unmapped"
      security:
      - sessionUuidCookie:
        - "N/A"
      summary: "Suggest a bulk load mapping for an uploaded file"
      tags:
      - "Bulk Load"
  /qqq/v1/{applicationApiPath}/{applicationApiVersion}/bulkLoad/{tableName}/validate:
    post:
      description: "Run the table's bulk-insert process over an uploaded file with\
        \ the given v1 bulk load profile - the same mapping, value mapping and validation\
        \ a real load uses - and stop at its review step, so nothing is stored.  SAMPLE\
        \ validates the first 100 rows; FULL the whole file.  Returns the standard\
        \ process summary lines, counts, and error groups with row numbers.  Values\
        \ of classified fields are left out unless the request's `X-QQQ-AI-Route`\
        \ header is `hipaa`.  The upload must be the session user's.  Requires the\
        \ table's bulk-insert process permission."
      parameters:
      - description: "The table the file would be loaded into."
        example: "person"
        in: "path"
        name: "tableName"
        required: true
        schema:
          type: "string"
      requestBody:
        content:
          application/json:
            schema:
              properties:
                uploadRef:
                  description: "The opaque ref of an upload the session user owns."
                  type: "string"
                profile:
                  description: "A v1 bulk load profile: version, layout (FLAT), hasHeaderRow,\
                    \ and fieldList entries of fieldName, columnIndex, headerName,\
                    \ defaultValue, doValueMapping, valueMappings and clearIfEmpty."
                  type: "object"
                mode:
                  description: "SAMPLE (default, the first 100 rows) or FULL."
                  enum:
                  - "SAMPLE"
                  - "FULL"
                  type: "string"
              type: "object"
        required: false
      responses:
        200:
          content:
            application/json:
              examples:
                dryRun:
                  value:
                    errorCount: 1
                    mode: "SAMPLE"
                    okCount: 2
                    processName: "person.bulkInsert"
                    recordCount: 3
              schema:
                $ref: "#/components/schemas/BulkLoadValidateResponseV1"
          description: "The dry run's summary and error groups"
      security:
      - sessionUuidCookie:
        - "N/A"
      summary: "Dry-run a bulk load profile over an uploaded file"
      tags:
      - "Bulk Load"
