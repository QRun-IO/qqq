name: Published BOM consumer
'on':
  workflow_dispatch:
    inputs:
      version:
        description: Published QQQ release or candidate version
        required: true
        type: string
permissions:
  contents: read
jobs:
  verify:
    uses: QRun-IO/qqq-orb/.github/workflows/core-published-bom-consumer.yml@bcab95daa80eb4741b7916cd07f4854b5d99eadf
    with:
      version: ${{ inputs.version || '' }}
