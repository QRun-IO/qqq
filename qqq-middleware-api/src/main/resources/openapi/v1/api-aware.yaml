  /qqq/v1/{applicationApiPath}/{applicationApiVersion}/table/{tableName}/relatedRecordPicker/{pickerName}/query:
    post:
      description: "Lists one page of the picker's target records as the user may\
        \ read them: the user's filter (the target table's own filter builder or a\
        \ saved view), ANDed with the picker's filter (resolved from the parent record\
        \ or form values) and the search term. Needs READ on the target table; table\
        \ permissions, record security locks and field security locks apply as on\
        \ the table query route. Reads limit + 1 rows for hasMore (no count). For\
        \ MULTI_CHILD and LINK with a primaryKey, linkedIds says which returned records\
        \ the parent already has rows for."
      parameters:
      - description: "Name of the table that declares the picker (e.g. the order)."
        example: "sales_order"
        in: "path"
        name: "tableName"
        required: true
        schema:
          type: "string"
      - description: "Name of the picker, from the table metadata's relatedRecordPickers."
        example: "addSkus"
        in: "path"
        name: "pickerName"
        required: true
        schema:
          type: "string"
      requestBody:
        content:
          application/json:
            schema:
              properties:
                primaryKey:
                  description: "Primary key of the parent record (required for MULTI_CHILD\
                    \ and LINK; for SINGLE, the record being edited, if any). Read\
                    \ with the user's own security."
                  type: "string"
                values:
                  description: "Current form values (SINGLE on a create form, when\
                    \ there is no primaryKey), for ${input.fieldName} variables in\
                    \ the picker's filters"
                  type: "object"
                searchTerm:
                  description: "Case-insensitive text matched (contains) against the\
                    \ target table's search fields, or its record-label fields"
                  type: "string"
                filter:
                  $ref: "#/components/schemas/QueryFilter"
                  description: "The user's filter on the target table (criteria and\
                    \ orderBys on target fields only); ANDed with the picker's filter"
                skip:
                  description: "Records to skip (offset paging)"
                  type: "integer"
                limit:
                  description: "Records per page, 1 to 200 (default 50)"
                  type: "integer"
              type: "object"
        required: false
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelatedRecordPickerQueryResponseV1"
          description: "Query the records a related-record picker offers: result"
      security:
      - sessionUuidCookie:
        - "N/A"
      summary: "Query the records a related-record picker offers"
      tags:
      - "Tables"
  /qqq/v1/{applicationApiPath}/{applicationApiVersion}/table/{tableName}/relatedRecordPicker/{pickerName}/prepare:
    post:
      description: "Builds, without saving, one child row per picked target: the picker's\
        \ child field defaults, values copied from the target, and the parent and\
        \ target keys. The client shows the reviewFieldNames of each row for the user\
        \ to fill, then calls add. Needs INSERT on the child table; every target must\
        \ be available through the picker's query (else 400)."
      parameters:
      - description: "Name of the table that declares the picker (e.g. the order)."
        example: "sales_order"
        in: "path"
        name: "tableName"
        required: true
        schema:
          type: "string"
      - description: "Name of the picker, from the table metadata's relatedRecordPickers."
        example: "addSkus"
        in: "path"
        name: "pickerName"
        required: true
        schema:
          type: "string"
      requestBody:
        content:
          application/json:
            schema:
              properties:
                primaryKey:
                  description: "Primary key of the parent record. Read with the user's\
                    \ own security."
                  type: "string"
                targetIds:
                  description: "Primary keys of the picked target records"
                  items:
                    type: "string"
                  type: "array"
              type: "object"
        required: false
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelatedRecordPickerPrepareResponseV1"
          description: "Prepare child rows for picked records (MULTI_CHILD, LINK):\
            \ result"
      security:
      - sessionUuidCookie:
        - "N/A"
      summary: "Prepare child rows for picked records (MULTI_CHILD, LINK)"
      tags:
      - "Tables"
  /qqq/v1/{applicationApiPath}/{applicationApiVersion}/table/{tableName}/relatedRecordPicker/{pickerName}/add:
    post:
      description: "Inserts one row per picked target (targetIds) or per reviewed\
        \ row (records), all or nothing, through the standard insert action: INSERT\
        \ permission on the child table, record security locks, validation, customizers,\
        \ automations and audit. Only the picker's review fields are taken from the\
        \ client; the parent and target keys always come from the server. Every target\
        \ must be available through the picker's query (else 400). Row errors are\
        \ a 400 naming each row, and nothing is saved."
      parameters:
      - description: "Name of the table that declares the picker (e.g. the order)."
        example: "sales_order"
        in: "path"
        name: "tableName"
        required: true
        schema:
          type: "string"
      - description: "Name of the picker, from the table metadata's relatedRecordPickers."
        example: "addSkus"
        in: "path"
        name: "pickerName"
        required: true
        schema:
          type: "string"
      requestBody:
        content:
          application/json:
            schema:
              properties:
                primaryKey:
                  description: "Primary key of the parent record. Read with the user's\
                    \ own security."
                  type: "string"
                targetIds:
                  description: "Primary keys of the picked target records"
                  items:
                    type: "string"
                  type: "array"
                records:
                  description: "Reviewed child rows (instead of targetIds), e.g. the\
                    \ prepare route's rows after the user filled the review fields"
                  items:
                    properties:
                      values:
                        description: "The row's values: the childTargetFieldName (which\
                          \ target) and the picker's reviewFieldNames; other values\
                          \ are ignored, and the parent and target keys always come\
                          \ from the server"
                        type: "object"
                    type: "object"
                  type: "array"
              type: "object"
        required: false
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelatedRecordPickerAddResponseV1"
          description: "Add child or join rows for picked records (MULTI_CHILD, LINK):\
            \ result"
      security:
      - sessionUuidCookie:
        - "N/A"
      summary: "Add child or join rows for picked records (MULTI_CHILD, LINK)"
      tags:
      - "Tables"
  /qqq/v1/{applicationApiPath}/{applicationApiVersion}/table/{tableName}/relatedRecordPicker/{pickerName}/remove:
    post:
      description: "Deletes the parent's join rows for the given targets through the\
        \ standard delete action (DELETE permission on the join table, record security\
        \ locks, audit). Only for LINK pickers (else 400); child rows of a MULTI_CHILD\
        \ picker are deleted with the table delete route."
      parameters:
      - description: "Name of the table that declares the picker (e.g. the order)."
        example: "sales_order"
        in: "path"
        name: "tableName"
        required: true
        schema:
          type: "string"
      - description: "Name of the picker, from the table metadata's relatedRecordPickers."
        example: "addSkus"
        in: "path"
        name: "pickerName"
        required: true
        schema:
          type: "string"
      requestBody:
        content:
          application/json:
            schema:
              properties:
                primaryKey:
                  description: "Primary key of the parent record. Read with the user's\
                    \ own security."
                  type: "string"
                targetIds:
                  description: "Primary keys of the picked target records"
                  items:
                    type: "string"
                  type: "array"
              type: "object"
        required: false
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelatedRecordPickerRemoveResponseV1"
          description: "Unlink picked records (LINK): result"
      security:
      - sessionUuidCookie:
        - "N/A"
      summary: "Unlink picked records (LINK)"
      tags:
      - "Tables"
