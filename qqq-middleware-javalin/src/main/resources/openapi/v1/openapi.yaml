                        firstName: "Darin"
                        lastName: "Kelkhoff"
                      recordLabel: "Darin Kelkhoff"
                      tableName: "person"
                      values:
                        id: 1
                        firstName: "Darin"
                        lastName: "Kelkhoff"
              schema:
