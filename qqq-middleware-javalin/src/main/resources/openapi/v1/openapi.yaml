      description: "Fetch the panels shown on a record's developer view: one per developer\
        \ panel provider (built in, or\nregistered by modules and qbits in the instance's\
        \ developerPanels supplemental meta-data) that is available\nfor this table\
        \ and record for the current user - for example record security, ESB events,\
        \ quick search\nindexing, or SQL workbench queries.\n\nRequires permission\
        \ to read records from the table, and the record must be visible under its\
        \ record\nsecurity locks.  If the record is not found, a 404 is returned.\
        \  A provider that fails yields a panel\nwith an error message rather than\
        \ failing the request."
      parameters:
