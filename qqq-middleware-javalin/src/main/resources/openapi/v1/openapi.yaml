components:
  schemas:
    AppMetaData:
      properties:
        childMap:
          additionalProperties:
            $ref: "#/components/schemas/AppTreeNode"
          description: "Map of other apps, tables, process, and reports, which are\
            \ contained within this app.  Same contents as the children list, just\
            \ structured as a map."
          type: "object"
        children:
          description: "List of other apps, tables, process, and reports, which are\
            \ contained within this app."
          items:
            $ref: "#/components/schemas/AppTreeNode"
          type: "array"
        icon:
          $ref: "#/components/schemas/Icon"
          description: "Icon to display for the app."
        label:
          description: "User-facing name for this app"
          type: "string"
        name:
          description: "Unique name for this app within the QQQ Instance"
          type: "string"
        sections:
          description: "List of sections - sub-divisions of the app, to further organize\
            \ its children."
          items:
            $ref: "#/components/schemas/AppSection"
          type: "array"
        supplementalAppMetaData:
          description: "Additional meta-data describing the app, which may not be\
            \ known to the QQQ backend core module."
          type: "object"
        widgets:
          description: "List of widgets names that are part of this app.  These strings\
            \ should be keys to the widgets map in the QQQ Instance."
          items:
            type: "string"
          type: "array"
      type: "object"
    AppSection:
      properties:
        icon:
          $ref: "#/components/schemas/Icon"
          description: "Icon to display for the section."
        label:
          description: "User-facing name of the section."
          type: "string"
        name:
          description: "Unique (within the app) name for this section."
          type: "string"
        processes:
          description: "List of process names for the section"
          items:
            type: "string"
          type: "array"
        reports:
          description: "List of report names for the section"
          items:
            type: "string"
          type: "array"
        tables:
          description: "List of table names for the section"
          items:
            type: "string"
          type: "array"
      type: "object"
    AppTreeNode:
      properties:
        children:
          description: "Child elements.  Only applies for type='app', which contains\
            \ additional apps under it"
          items:
            $ref: "#/components/schemas/AppTreeNode"
          type: "array"
        icon:
          $ref: "#/components/schemas/Icon"
          description: "Icon to display for the item."
        label:
          description: "User-facing name of the element."
          type: "string"
        name:
          description: "Unique (within its type) name for this element.  e.g., for\
            \ type = 'table', the table's name."
          type: "string"
        type:
          description: "The type of node (table, process, report, app)"
          type: "string"
      type: "object"
    AssociatedScriptMetaData:
      properties:
        fieldName:
          description: "Name of the field, in the record's table, that references\
            \ the script."
          type: "string"
        scriptTypeId:
          description: "Id of the script type (a scriptType record) of the scripts\
            \ this field references."
          type: "object"
      type: "object"
    Association:
      properties:
        associatedTableName:
          description: "Name of the associated table; its permissions remain independent"
          type: "string"
        join:
          description: "The named join and field pairs defining this association"
          properties:
            joinOns:
              type: "array"
            leftTable:
              type: "string"
            name:
              type: "string"
            orderBys:
              type: "array"
            rightTable:
              type: "string"
            type:
              enum:
              - "ONE_TO_ONE"
              - "ONE_TO_MANY"
              - "MANY_TO_ONE"
              - "MANY_TO_MANY"
              type: "string"
          type: "object"
        name:
          description: "Exact name used for this group in associatedRecords"
          type: "string"
      type: "object"
    AuthenticationMetaDataResponseV1:
      properties:
        branding:
          description: "The application's branding that is safe to show before sign-in\
            \ (names, logo, icon and accent colors; never\nbanners), so a login page\
            \ can look like the application.  Absent when the instance defines no\
            \ branding."
          properties:
            accentColor:
              description: "Primary accent color, as a CSS color value."
              type: "string"
            accentColorLight:
              description: "Light variant of the accent color, as a CSS color value."
              type: "string"
            appName:
              description: "Name of this application, for display to users."
              type: "string"
            companyName:
              description: "Name of the company that operates this application."
              type: "string"
            icon:
              description: "Path or URL of the application's small icon image."
              type: "string"
            logo:
              description: "Path or URL of the application's logo image."
              type: "string"
          type: "object"
        dashboardCspSources:
          description: "Optional public CSP source additions for standalone dashboards,\
            \ derived from configured application features; never a full policy or\
            \ inline script hashes."
          properties:
            connectSrc:
              description: "HTTP(S) connection sources required by configured features;\
                \ no default policy sources."
              items:
                type: "string"
              type: "array"
            frameSrc:
              description: "Frame sources required by configured features."
              items:
                type: "string"
              type: "array"
            scriptSrc:
              description: "Script sources required by configured features; no inline\
                \ hashes, nonces or unsafe keywords."
              items:
                type: "string"
              type: "array"
            styleSrc:
              description: "Style sources required by configured features."
              items:
                type: "string"
              type: "array"
          type: "object"
        name:
          description: "Unique name for the authentication metaData object within\
            \ the QInstance.\n"
          type: "string"
        type:
          description: "Specifier for the type of authentication module being used.\n\
            \nFrontends should use this value to determine how to prompt the user\
            \ for authentication credentials.\nIn addition, depending on this value,\
            \ additional properties will be included in this object, as\nmay be needed\
            \ to complete the authorization workflow with the provider (e.g., a baseUrl,\
            \ clientId,\nand audience for an OAuth type workflow)."
          type: "string"
        values:
          description: "Additional values, as determined by the type of authentication\
            \ provider.\n"
          oneOf:
          - description: "No additional values are used for some authentication providers."
            type: "object"
          - description: "Additional values used by the Auth0 type authentication\
              \ provider."
            properties:
              audience:
                description: "Audience for auth0"
                type: "string"
              baseUrl:
                description: "BaseUrl for auth0"
                type: "string"
              clientId:
                description: "ClientId for auth0"
                type: "string"
            type: "object"
          - description: "Additional values used by the OAuth2 type authentication\
              \ provider."
            properties:
              baseUrl:
                description: "BaseUrl for OAuth2 provider"
                type: "string"
              clientId:
                description: "ClientId for OAuth2 provider"
                type: "string"
              scopes:
                description: "OAuth2 scopes to request (space-separated)"
                type: "string"
            type: "object"
      type: "object"
    BackChannelLogoutResponseV1:
      type: "object"
    BasicErrorResponseV1:
      properties:
        error:
          description: "Description of the error"
          type: "string"
      type: "object"
    Branding:
      properties:
        accentColor:
          description: "Primary accent color, as a CSS color value."
          type: "string"
        accentColorLight:
          description: "Light variant of the accent color, as a CSS color value."
          type: "string"
        appName:
          description: "Name of this application, for display to users."
          type: "string"
        banners:
          additionalProperties:
            $ref: "#/components/schemas/BrandingBanner"
          description: "Banners to display, keyed by the slot where each is shown."
          type: "object"
        companyName:
          description: "Name of the company that operates this application."
          type: "string"
        companyUrl:
          description: "URL for the company's web site."
          type: "string"
        icon:
          description: "Path or URL of the application's small icon image."
          type: "string"
        logo:
          description: "Path or URL of the application's logo image."
          type: "string"
      type: "object"
    BrandingBanner:
      properties:
        additionalStyles:
          description: "Additional CSS style properties for the banner."
          type: "object"
        backgroundColor:
          description: "Background color, as a CSS color value."
          type: "string"
        messageHTML:
          description: "HTML message, used instead of the plain-text message when\
            \ set."
          type: "string"
        messageText:
          description: "Plain-text message."
          type: "string"
        severity:
          description: "Severity of the message: INFO, WARNING, ERROR or SUCCESS."
          type: "string"
        textColor:
          description: "Text color, as a CSS color value."
          type: "string"
      type: "object"
    BuiltInViewV1:
      properties:
        filter:
          properties:
            booleanOperator:
              enum:
              - "OR"
              type: "string"
            criteria:
              items:
                properties:
                  fieldName:
                    type: "string"
                  operator:
                    enum:
                    - "EQUALS"
                    type: "string"
                  values:
                    items:
                      description: "The executing session's user id. Display as Me.\
                        \ A missing user matches nothing."
                      properties:
                        type:
                          enum:
                          - "CurrentUser"
                          type: "string"
                      type: "object"
                    type: "array"
                type: "object"
              type: "array"
          type: "object"
        label:
          type: "string"
        name:
          type: "string"
      type: "object"
    BulkLoadColumnProfile:
      properties:
        classification:
          description: "Data classification of the mapped field (PUBLIC, CONFIDENTIAL,\
            \ PII, PHI), or null."
          type: "string"
        columnIndex:
          description: "Zero-based column index in the file."
          type: "number"
        columnLetter:
          description: "Spreadsheet-style column letter (A, B, ... AA)."
          type: "string"
        distinctCount:
          description: "Distinct non-blank values counted (capped at 1000)."
          type: "number"
        distinctCountCapped:
          description: "Whether more distinct values exist than were counted."
          type: "boolean"
        header:
          description: "Header text (or Column A, Column B ... when the file has no\
            \ header row)."
          type: "string"
        inferredType:
          description: "INTEGER, DECIMAL, BOOLEAN, DATE, DATE_TIME or STRING, from\
            \ the profiled values."
          type: "string"
        mappedFieldName:
          description: "The table field the suggested mapping assigns this column\
            \ to, or null."
          type: "string"
        maxLength:
          description: "Longest value length."
          type: "number"
        patternClass:
          description: "DATE_LIKE, EMAIL_LIKE, NUMERIC, CODE_LIKE, TEXT or EMPTY."
          type: "string"
        percentBlank:
          description: "Percent of profiled rows where the column is blank."
          type: "number"
        sampleValues:
          description: "Up to sampleCount distinct values, only when samplesAllowed;\
            \ otherwise empty."
          items:
            type: "string"
          type: "array"
        samplesAllowed:
          description: "Whether sample values may be shown: an AI route of hipaa,\
            \ or a mapped field that is unclassified or PUBLIC. Unmapped columns are\
            \ treated as classified."
          type: "boolean"
      type: "object"
    BulkLoadColumnRef:
      properties:
        columnIndex:
          description: "Zero-based column index in the file."
          type: "number"
        header:
          description: "Header text."
          type: "string"
      type: "object"
    BulkLoadFieldRef:
      properties:
        fieldName:
          description: "Field name."
          type: "string"
        label:
          description: "Field label."
          type: "string"
        possibleValueSourceName:
          description: "Possible value source of the field, if any (its file values\
            \ need mapping)."
          type: "string"
      type: "object"
    BulkLoadRowError:
      properties:
        errorCode:
          description: "VALUE_TYPE, POSSIBLE_VALUE, DUPLICATE, REQUIRED or OTHER."
          type: "string"
        fieldName:
          description: "The field the error is about, when known."
          type: "string"
        message:
          description: "The error message (value-free)."
          type: "string"
        rowNumbers:
          description: "File rows with the error, e.g. Row 3; Rows 7-9 (no values)."
          type: "string"
      type: "object"
    BulkLoadSuggestMappingResponseV1:
      properties:
        profile:
          description: "The suggested bulk load profile (v1: version, layout, hasHeaderRow,\
            \ isBulkEdit, and fieldList entries of fieldName, columnIndex, headerName,\
            \ defaultValue, doValueMapping, valueMappings, clearIfEmpty)."
          type: "object"
        unmappedColumns:
          description: "File columns the suggestion does not map."
          items:
            $ref: "#/components/schemas/BulkLoadColumnRef"
          type: "array"
        unmappedRequiredFields:
          description: "Required table fields the suggestion does not fill."
          items:
            $ref: "#/components/schemas/BulkLoadFieldRef"
          type: "array"
        valueMappingFields:
          description: "Mapped fields with a possible value source, whose file values\
            \ may need mapping."
          items:
            $ref: "#/components/schemas/BulkLoadFieldRef"
          type: "array"
      type: "object"
    BulkLoadSummaryLine:
      properties:
        bulletsOfText:
          description: "Example rows (and their values, unless masked for a classified\
            \ field)."
          items:
            type: "string"
          type: "array"
        count:
          description: "Number of records the line describes."
          type: "number"
        message:
          description: "The standard process summary message."
          type: "string"
        status:
          description: "OK, INFO, WARNING or ERROR."
          type: "string"
      type: "object"
    BulkLoadUploadProfileResponseV1:
      properties:
        columns:
          description: "The columns."
          items:
            $ref: "#/components/schemas/BulkLoadColumnProfile"
          type: "array"
        fileName:
          description: "The uploaded file name."
          type: "string"
        hasHeaderRow:
          description: "Whether row 1 looks like a header row (the suggester maps\
            \ at least one of its values)."
          type: "boolean"
        rowsProfiled:
          description: "Data rows profiled (up to 1000)."
          type: "number"
        uploadRef:
          description: "The upload ref."
          type: "string"
      type: "object"
    BulkLoadValidateResponseV1:
      properties:
        errorCount:
          description: "Records with errors."
          type: "number"
        errors:
          description: "Error groups with row numbers (up to 100)."
          items:
            $ref: "#/components/schemas/BulkLoadRowError"
          type: "array"
        jobId:
          description: "Reserved: a FULL run over the durable threshold will run as\
            \ a VALIDATE job and return its id. Always null in this version."
          type: "number"
        mode:
          description: "SAMPLE (the first 100 rows) or FULL (the whole file)."
          type: "string"
        okCount:
          description: "Records that would be inserted."
          type: "number"
        previewRecordCount:
          description: "For SAMPLE, the rows validated."
          type: "number"
        processName:
          description: "The table's bulk-insert process the dry run used."
          type: "string"
        recordCount:
          description: "Records read from the file."
          type: "number"
        summaryLines:
          description: "The standard process summary lines."
          items:
            $ref: "#/components/schemas/BulkLoadSummaryLine"
          type: "array"
      type: "object"
    ExposedJoin:
      properties:
        isMany:
          description: "Whether or not this join is 'to many' in nature"
          type: "boolean"
        joinPath:
          description: "A list of joins that travel from the base table to the exposed\
            \ join table"
          items:
            properties:
              joinOns:
                type: "array"
              leftTable:
                type: "string"
              name:
                type: "string"
              orderBys:
                type: "array"
              rightTable:
                type: "string"
              type:
                enum:
                - "ONE_TO_ONE"
                - "ONE_TO_MANY"
                - "MANY_TO_ONE"
                - "MANY_TO_MANY"
                type: "string"
            type: "object"
          type: "array"
        joinTable:
          $ref: "#/components/schemas/TableMetaData"
          description: "The meta-data for the joined table"
        label:
          description: "User-facing label to display for this join"
          type: "string"
      type: "object"
    FieldAdornment:
      properties:
        type:
          description: "Type of this adornment"
          enum:
          - "LINK"
          - "CHIP"
          - "SIZE"
          - "CODE_EDITOR"
          - "RENDER_HTML"
          - "REVEAL"
          - "FILE_DOWNLOAD"
          - "FILE_UPLOAD"
          - "TOOLTIP"
          - "WIDGET"
          - "ERROR"
          - "FILE_PREVIEW"
          type: "string"
        values:
          description: "Values associated with this adornment.  Keys and the meanings\
            \ of their values differ by type; the known\nkeys are listed (each names\
            \ the type(s) it applies to).  CHIP also uses pattern keys: `color.{fieldValue}`\n\
            (one of default, info, primary, secondary, success, warning, error) and\
            \ `icon.{fieldValue}` (an icon name),\ngiving the chip colour and icon\
            \ for a field value.  Clients ignore keys they do not know."
          properties:
            target:
              description: "LINK: where to open the link: _blank for a new window/tab;\
                \ otherwise the same view."
              type: "string"
            toRecordFromTable:
              description: "LINK: the field value is a primary key of this table;\
                \ link to that record (a client navigates to the record view)."
              type: "string"
            toRecordFromTableDynamic:
              description: "LINK: the target table is per record - read it from the\
                \ record displayValue `{fieldName}:toRecordFromTableDynamic`."
              type: "boolean"
            fileNameField:
              description: "FILE_DOWNLOAD, FILE_PREVIEW: the field holding the file\
                \ name to save or show."
              type: "string"
            defaultExtension:
              description: "FILE_DOWNLOAD: extension for the saved file when the name\
                \ has none."
              type: "string"
            defaultMimeType:
              description: "FILE_DOWNLOAD, FILE_PREVIEW: MIME type to assume when\
                \ none is known."
              type: "string"
            supplementalProcessName:
              description: "FILE_DOWNLOAD: process the server runs to produce the\
                \ file (the client just downloads)."
              type: "string"
            supplementalCodeReference:
              additionalProperties: true
              description: "FILE_DOWNLOAD: code the server runs to produce the file\
                \ (the client just downloads)."
              type: "object"
            downloadUrlDynamic:
              description: "FILE_DOWNLOAD: the download URL is per record - read it\
                \ from the record displayValue `{fieldName}:downloadUrlDynamic`."
              type: "boolean"
            fileNameFormat:
              description: "FILE_DOWNLOAD: format (with %s placeholders) for the saved\
                \ file name."
              type: "string"
            fileNameFormatFields:
              description: "FILE_DOWNLOAD: fields whose values fill fileNameFormat,\
                \ in order."
              items:
                type: "string"
              type: "array"
            width:
              description: "SIZE: display width of the field - one of xsmall, small,\
                \ medium, medlarge, large, xlarge (semantic widths; each client maps\
                \ them to its own columns or characters). FILE_UPLOAD: width of the\
                \ upload control."
              enum:
              - "xsmall"
              - "small"
              - "medium"
              - "medlarge"
              - "large"
              - "xlarge"
              type: "string"
            format:
              description: "FILE_UPLOAD: accepted file formats (e.g. .csv,.xlsx)."
              type: "string"
            languageMode:
              description: "CODE_EDITOR: language of the code (e.g. javascript, sql,\
                \ json, velocity) - for highlighting; a client without an editor shows\
                \ it monospaced."
              type: "string"
            staticText:
              description: "TOOLTIP: the tooltip text."
              type: "string"
            tooltipDynamic:
              description: "TOOLTIP: the text is per record - read it from the record\
                \ displayValue `{fieldName}:tooltipDynamic`."
              type: "boolean"
            thumbnailUrlField:
              description: "FILE_PREVIEW: field holding a thumbnail image URL."
              type: "string"
            fullSizeUrlField:
              description: "FILE_PREVIEW: field holding the full-size file URL."
              type: "string"
            mimeTypeField:
              description: "FILE_PREVIEW: field holding the MIME type (decides image,\
                \ video, PDF or download-only)."
              type: "string"
            altTextField:
              description: "FILE_PREVIEW: field holding alternative text."
              type: "string"
            captionField:
              description: "FILE_PREVIEW: field holding a caption."
              type: "string"
            widthField:
              description: "FILE_PREVIEW: field holding the pixel width."
              type: "string"
            heightField:
              description: "FILE_PREVIEW: field holding the pixel height."
              type: "string"
            sizeBytesField:
              description: "FILE_PREVIEW: field holding the size in bytes."
              type: "string"
            thumbnailMaxSize:
              description: "FILE_PREVIEW: largest thumbnail edge in pixels."
              type: "integer"
            previewable:
              description: "FILE_PREVIEW: whether the file may be previewed (false:\
                \ download only)."
              type: "boolean"
            widgetName:
              description: "WIDGET: the widget that renders this field."
              type: "string"
          type: "object"
      type: "object"
    FieldMetaData:
      properties:
        accessTier:
          description: "Effective field access: FULL, REVEALABLE, MASKED, or HIDDEN.\
            \ Omitted means FULL. Restricted values are strings, regardless of field\
            \ type."
          enum:
          - "FULL"
          - "REVEALABLE"
          - "MASKED"
          - "HIDDEN"
          type: "string"
        adornments:
          description: "Special UI dressings to add to the field."
          items:
            $ref: "#/components/schemas/FieldAdornment"
          type: "array"
        allowedFilterOperators:
          description: "Allowed filter operators when restricted: EQUALS and IN for\
            \ REVEALABLE when exact match is enabled, otherwise empty. Omitted means\
            \ unrestricted."
          items:
            type: "string"
          type: "array"
        behaviors:
          description: "Names of the field's behaviors that a frontend applies while\
            \ editing, e.g., TO_UPPER_CASE, TO_LOWER_CASE or TRIM.  Absent when the\
            \ field has none."
          items:
            type: "string"
          type: "array"
        defaultValue:
          description: "Default value to use in this field."
          type: "string"
        displayFormat:
          description: "C-style format specifier for displaying values in this field."
          type: "string"
        gridColumns:
          description: "Width of this field in a 12-column record form or view grid\
            \ (e.g., 12 for the full width, 6 for half).  Absent when the frontend's\
            \ default applies."
          type: "number"
        helpContents:
          description: "Help Contents for this field."
          type: "array"
        inlinePossibleValueSource:
          description: "Inline possible-value source for this field; enumValues supply\
            \ choices without a separate lookup."
          properties:
            customCodeReference:
              properties:
                codeType:
                  enum:
                  - "JAVA"
                  - "JAVA_SCRIPT"
                  type: "string"
                inlineCode:
                  type: "string"
                name:
                  type: "string"
              type: "object"
            enumValues:
              type: "array"
            idType:
              enum:
              - "STRING"
              - "INTEGER"
              - "LONG"
              - "DECIMAL"
              - "BOOLEAN"
              - "DATE"
              - "TIME"
              - "DATE_TIME"
              - "TEXT"
              - "HTML"
              - "PASSWORD"
              - "BLOB"
              type: "string"
            label:
              type: "string"
            name:
              type: "string"
            orderByFields:
              type: "array"
            overrideIdField:
              type: "string"
            picker:
              properties:
                detailFields:
                  type: "array"
                filterFields:
                  type: "array"
                pageSize:
                  type: "number"
                previewField:
                  type: "string"
                searchFields:
                  type: "array"
                sorts:
                  type: "array"
                subtitleFields:
                  type: "array"
                thumbnailField:
                  type: "string"
                uploadProcessName:
                  type: "string"
                uploadResultIdField:
                  type: "string"
              type: "object"
            searchFields:
              type: "array"
            tableName:
              type: "string"
            type:
              enum:
              - "ENUM"
              - "TABLE"
              - "CUSTOM"
              type: "string"
            valueFields:
              type: "array"
            valueFieldsIfNotFound:
              type: "array"
            valueFormat:
              type: "string"
            valueFormatIfNotFound:
              type: "string"
          type: "object"
        isEditable:
          description: "Indicate if user may edit the value in this field."
          type: "boolean"
        isHeavy:
          description: "Indicator of 'heavy' fields, which are not loaded by default.\
            \  e.g., some blobs or long-texts"
          type: "boolean"
        isHidden:
          description: "Indicate if this field should be hidden from users"
          type: "boolean"
        isRequired:
          description: "Indicate if a value in this field is required."
          type: "boolean"
        isSortable:
          description: "False for restricted fields; omitted means sortable."
          type: "boolean"
        label:
          description: "User-facing name for this field"
          type: "string"
        maxLength:
          description: "For String fields, the max length the field supports."
          type: "number"
        maxValue:
          description: "For number fields, the largest value the field accepts (inclusive).\
            \  Absent when there is no such limit."
          type: "string"
        minValue:
          description: "For number fields, the smallest value the field accepts (inclusive).\
            \  Absent when there is no such limit."
          type: "string"
        name:
          description: "Unique name for this field within its container (table or\
            \ process)"
          type: "string"
        picker:
          description: "When this field's possible value source declares a record\
            \ picker (for sources over large tables), its configuration: thumbnail,\
            \ preview, subtitle and detail fields, filter fields, search fields, sorts\
            \ and page size.  Frontends offer a searchable, paged picker dialog."
          properties:
            detailFields:
              type: "array"
            filterFields:
              type: "array"
            pageSize:
              type: "number"
            previewField:
              type: "string"
            searchFields:
              type: "array"
            sorts:
              type: "array"
            subtitleFields:
              type: "array"
            thumbnailField:
              type: "string"
            uploadProcessName:
              type: "string"
            uploadResultIdField:
              type: "string"
          type: "object"
        pickerTableName:
          description: "When this field has a picker, the table its possible value\
            \ source reads, whose metadata describes the picker's fields."
          type: "string"
        possibleValueSourceDependencyBehavior:
          description: "DISABLE_UNTIL_SET disables a contingent field until its dependencies\
            \ are set (default). SHOW_ALL_UNTIL_SET keeps it enabled and omits criteria\
            \ with missing inputs in form searches. Absent for non-contingent fields."
          enum:
          - "DISABLE_UNTIL_SET"
          - "SHOW_ALL_UNTIL_SET"
          type: "string"
        possibleValueSourceDependsOn:
          description: "Names of fields controlling this field's choices, including\
            \ explicit and filter dependencies. Absent for non-contingent fields."
          items:
            type: "string"
          type: "array"
        possibleValueSourceName:
          description: "If this field's values should come from a possible value source,\
            \ then that PVS is named here."
          type: "string"
        supplementalMetaData:
          description: "Additional frontend-visible metadata for this field, keyed\
            \ by supplemental type."
          type: "object"
        type:
          description: "Data-type for this field"
          type: "string"
      type: "object"
    FilterCriteria:
      properties:
        fieldName:
          description: "Field name that this criteria applies to"
          type: "string"
        operator:
          description: "Logical operator that applies to this criteria"
          enum:
          - "EQUALS"
          - "NOT_EQUALS"
          - "NOT_EQUALS_OR_IS_NULL"
          - "IN"
          - "NOT_IN"
          - "IS_NULL_OR_IN"
          - "LIKE"
          - "NOT_LIKE"
          - "STARTS_WITH"
          - "ENDS_WITH"
          - "CONTAINS"
          - "CONTAINS_ALL"
          - "NOT_STARTS_WITH"
          - "NOT_ENDS_WITH"
          - "NOT_CONTAINS"
          - "LESS_THAN"
          - "LESS_THAN_OR_EQUALS"
          - "GREATER_THAN"
          - "GREATER_THAN_OR_EQUALS"
          - "IS_BLANK"
          - "IS_NOT_BLANK"
          - "BETWEEN"
          - "NOT_BETWEEN"
          - "TRUE"
          - "FALSE"
          type: "string"
        values:
          description: "Values to apply via the operator to the field"
          items:
            type: "string"
          type: "array"
      type: "object"
    FrontendComponent:
      properties:
        type:
          description: "The type of this component.  e.g., what kind of UI element(s)\
            \ should be presented to the user."
          enum:
          - "HELP_TEXT"
          - "BULK_EDIT_FORM"
          - "BULK_LOAD_FILE_MAPPING_FORM"
          - "BULK_LOAD_VALUE_MAPPING_FORM"
          - "BULK_LOAD_PROFILE_FORM"
          - "VALIDATION_REVIEW_SCREEN"
          - "EDIT_FORM"
          - "VIEW_FORM"
          - "DOWNLOAD_FORM"
          - "RECORD_LIST"
          - "PROCESS_SUMMARY_RESULTS"
          - "GOOGLE_DRIVE_SELECT_FOLDER"
          - "WIDGET"
          - "HTML"
          type: "string"
        values:
          $ref: "#/components/schemas/FrontendComponentValues"
          description: "Name-value pairs specific to the type of component."
          type: "object"
      type: "object"
    FrontendComponentValues:
      additionalProperties: true
      description: "These are the known values that can appear in the values map under\
        \ a FrontendComponent, to control\nhow that component should be presented\
        \ to the user.\n\nNote that additional properties may appear as well.\n\n\
        In addition, components are expected to use values from an active process's\
        \ `values` map (e.g., as included in\na `ProcessStepComplete` object), with\
        \ the following contract between component-types and expected values:\n\n\
        - For component type=`HTML`, there will be a process value with key=`${stepName}.html`\
        \ (e.g., `resultScreen.html`),\nwhose value is the HTML to display on that\
        \ screen.\n- For component type=`HELP_TEXT`:  There will be a process value\
        \ with key=`text`, whose value is the text to display on that screen.\nThere\
        \ may also be a process value with key=`previewText`, which, if present, can\
        \ be shown before the full text is shown,\ne.g., with a toggle control to\
        \ hide/show the `text` value.\n"
      properties:
        blocks:
          description: "Components of type=`WIDGET`, which are set as `isAdHocWidget=true`,\
            \ should include a list of WidgetBlocks in this value."
          items:
            $ref: "#/components/schemas/WidgetBlock"
          type: "array"
        includeFieldNames:
          description: "Components of type=`EDIT_FORM` can specify a subset of field\
            \ names to include.  This can be used to break a form up into\nsections,\
            \ by including multiple EDIT_FORM components, with different lists of\
            \ `includeFieldNames`.\n"
          items:
            type: "string"
          type: "array"
        isAdHocWidget:
          description: "Components of type=`WIDGET`, which do not reference a widget\
            \ defined in the QQQ Instance, but instead,\nare defined as a list of\
            \ blocks within a frontend step component, will have a this value set\
            \ to true."
          type: "boolean"
        sectionLabel:
          description: "Components of type=`EDIT_FORM` can specify a user-facing text\
            \ label to show on screen.\n"
          type: "string"
        widgetName:
          description: "Components of type=`WIDGET`, which should render a widget\
            \ defined in the QQQ instance, this value specifies\nthe name of that\
            \ widget.  Contrast with ad-hoc widgets.\n"
          type: "string"
      type: "object"
    FrontendStep:
      properties:
        backStepName:
          description: "Name of the step a user can go back to from this step (step\
            \ with isStepBack=true), when there is one."
          type: "string"
        components:
          description: "The components that make up this screen"
          items:
            $ref: "#/components/schemas/FrontendComponent"
          type: "array"
        formFields:
          description: "Fields used as form fields (inputs) on this step/screen"
          items:
            $ref: "#/components/schemas/FieldMetaData"
          type: "array"
        format:
          description: "An optional indicator of the screen format preferred by the\
            \ application to be used for this screen.  Different frontends may support\
            \ different formats, and implement them differently."
          type: "string"
        helpContents:
          description: "Help content shown on the step/screen."
          type: "array"
        label:
          description: "The user-facing name for this step"
          type: "string"
        name:
          description: "The unique name for this step within its process"
          type: "string"
        recordListFields:
          description: "Fields used in record-lists shown on the step/screen."
          items:
            $ref: "#/components/schemas/FieldMetaData"
          type: "array"
        viewFields:
          description: "Fields used as view-only fields on this step/screen"
          items:
            $ref: "#/components/schemas/FieldMetaData"
          type: "array"
      type: "object"
    Icon:
      properties:
        color:
          description: "A color code to use for displaying the icon"
          type: "string"
        name:
          description: "A material UI icon name."
          type: "string"
        path:
          description: "A path to an image file that can be requested from the server,\
            \ to serve as the icon image instead of a material UI icon."
          type: "string"
      type: "object"
    LogoutResponseV1:
      type: "object"
    ManageSessionResponseV1:
      properties:
        uuid:
          description: "Unique identifier of the session. Required to be returned\
            \ on subsequent requests in the sessionUUID Cookie, to prove authentication.\
            \ Not included when the cookie is HttpOnly or the session was resumed\
            \ from that cookie."
          type: "string"
        values:
          additionalProperties: true
          description: "Optional object with application-defined values."
          type: "object"
      type: "object"
    MaterialDashboardInstanceSettings:
      properties:
        processNamesToAddToAllQueryAndViewScreens:
          description: "Names of processes to offer on the query and record-view screens\
            \ of every table, in their configured order.  Only processes that the\
            \ user may see (i.e., that are in the meta-data's `processes` map) are\
            \ listed, so the list may be empty."
          items:
            type: "string"
          type: "array"
        recordViewActionsPlacement:
          description: "Where the record view puts its actions: IN_IDENTITY_SECTION\
            \ or INLINE_WITH_PAGE_TITLE.  When set, this overrides each table's placement."
          type: "string"
        weekdayCriteriaSettings:
          $ref: "#/components/schemas/MaterialDashboardWeekdayCriteriaSettings"
          description: "Weekday criteria settings for the query screens (day is any\
            \ of, day is none of).  Omitted when the material dashboard meta-data\
            \ does not define them."
      type: "object"
    MaterialDashboardWeekdayCriteriaSettings:
      properties:
        dateTimeFieldFunctionArguments:
          additionalProperties: true
          description: "Arguments for the WeekdayOfDateTime field function that a\
            \ frontend sends with weekday criteria on date-time fields (for example\
            \ timeZoneId or useSessionZoneId)."
          type: "object"
        enabled:
          description: "Whether query screens offer the weekday criteria (day is any\
            \ of, day is none of) on date and date-time fields."
          type: "boolean"
      type: "object"
    MetaDataResponseV1:
      properties:
        appTree:
          description: "Tree of apps within the QQQ Instance, sorted and organized\
            \ hierarchically, for presentation to a user."
          items:
            $ref: "#/components/schemas/AppTreeNode"
          type: "array"
        apps:
          additionalProperties:
            $ref: "#/components/schemas/AppMetaData"
          description: "Map of all apps within the QQQ Instance (that the user has\
            \ permission to see that they exist)."
          type: "object"
        branding:
          description: "Application identity (names, logo, icon, accent colors and\
            \ banners), when the instance defines it."
          properties:
            accentColor:
              description: "Primary accent color, as a CSS color value."
              type: "string"
            accentColorLight:
              description: "Light variant of the accent color, as a CSS color value."
              type: "string"
            appName:
              description: "Name of this application, for display to users."
              type: "string"
            banners:
              additionalProperties:
                $ref: "#/components/schemas/BrandingBanner"
              description: "Banners to display, keyed by the slot where each is shown."
              type: "object"
            companyName:
              description: "Name of the company that operates this application."
              type: "string"
            companyUrl:
              description: "URL for the company's web site."
              type: "string"
            icon:
              description: "Path or URL of the application's small icon image."
              type: "string"
            logo:
              description: "Path or URL of the application's logo image."
              type: "string"
          type: "object"
        environmentValues:
          additionalProperties:
            type: "string"
          description: "Environment values a frontend may use: Google Picker public\
            \ browser settings GOOGLE_APP_CLIENT_ID and GOOGLE_APP_API_KEY, and the\
            \ analytics settings (ANALYTICS_PROVIDERS, ANALYTICS_PLUGIN_SCRIPTS, ANALYTICS_PLUGIN_SCRIPT_URLS,\
            \ GOOGLE_ANALYTICS_ENABLED, GOOGLE_ANALYTICS_TRACKING_ID, POSTHOG_ENABLED,\
            \ POSTHOG_API_KEY, POSTHOG_PROJECT_API_KEY, POSTHOG_HOST, and any other\
            \ ANALYTICS_* value), from the instance's QQQ_ENV_* environment.  An explicit\
            \ allow-list - never the whole environment.  Omitted when none are set."
          type: "object"
        helpContents:
          additionalProperties: true
          description: "Instance-level help content, by slot name (for example the\
            \ query screen's bulkAddFilterValues and bulkAddFilterValuesPossibleValueSource\
            \ slots).  Omitted when the instance defines none."
          type: "object"
        homeAppName:
          description: "Name of the app whose dashboard a frontend shows as the instance's\
            \ home page (for example at /app/), when the instance designates one and\
            \ the user may access that app.  Omitted otherwise, in which case the\
            \ frontend uses its own default home page."
          type: "string"
        metaDataGeneration:
          type: "number"
        processes:
          additionalProperties:
            $ref: "#/components/schemas/ProcessMetaDataLight"
          description: "Map of all processes within the QQQ Instance (that the user\
            \ has permission to see that they exist)."
          type: "object"
        reports:
          additionalProperties:
            properties:
              hasPermission:
                description: "Whether the user may run the report."
                type: "object"
              iconName:
                description: "Name of the report's icon."
                type: "string"
              label:
                description: "User-facing name for this report."
                type: "string"
              name:
                description: "Unique name for this report within the QQQ Instance."
                type: "string"
              processName:
                description: "Process that runs this report, when it has one; otherwise\
                  \ it runs from GET /reports/{reportName}."
                type: "string"
            type: "object"
          description: "Map of all reports within the QQQ Instance (that the user\
            \ has permission to see that they exist)."
          type: "object"
        supplementalInstanceMetaData:
          description: "Settings from supplemental modules that a frontend may use\
            \ (an explicit allow-list - not the supplemental meta-data objects themselves).\
            \  Omitted when the instance defines none of them."
          properties:
            assistant:
              additionalProperties: true
              description: "Present (an object) when the instance has the assistant\
                \ QBit's `assistant` supplemental meta-data - that is, when the assistant\
                \ is installed and enabled, so a frontend may probe its routes.  Always\
                \ has `available: true`, plus the strings, numbers and booleans the\
                \ QBit publishes for frontends."
              type: "object"
            materialDashboard:
              description: "Settings from the instance's `materialDashboard` supplemental\
                \ meta-data, when the instance defines it."
              properties:
                processNamesToAddToAllQueryAndViewScreens:
                  description: "Names of processes to offer on the query and record-view\
                    \ screens of every table, in their configured order.  Only processes\
                    \ that the user may see (i.e., that are in the meta-data's `processes`\
                    \ map) are listed, so the list may be empty."
                  items:
                    type: "string"
                  type: "array"
                recordViewActionsPlacement:
                  description: "Where the record view puts its actions: IN_IDENTITY_SECTION\
                    \ or INLINE_WITH_PAGE_TITLE.  When set, this overrides each table's\
                    \ placement."
                  type: "string"
                weekdayCriteriaSettings:
                  description: "Weekday criteria settings for the query screens (day\
                    \ is any of, day is none of).  Omitted when the material dashboard\
                    \ meta-data does not define them."
                  properties:
                    dateTimeFieldFunctionArguments:
                      additionalProperties: true
                      description: "Arguments for the WeekdayOfDateTime field function\
                        \ that a frontend sends with weekday criteria on date-time\
                        \ fields (for example timeZoneId or useSessionZoneId)."
                      type: "object"
                    enabled:
                      description: "Whether query screens offer the weekday criteria\
                        \ (day is any of, day is none of) on date and date-time fields."
                      type: "boolean"
                  type: "object"
              type: "object"
            materialDashboardTheme:
              additionalProperties: true
              description: "The application theme from the instance's MaterialDashboardThemeMetaData\
                \ supplemental meta-data, when the instance defines it.  Keys are\
                \ MaterialDashboardThemeMetaData property names (for example primaryColor,\
                \ fontFamily, typographyH1FontSize, borderRadiusGlobal, density, customCss,\
                \ brandedHeaderEnabled, sidebarBackgroundColor, tableHeaderBackgroundColor);\
                \ values are strings, numbers or booleans.  An explicit allow-list\
                \ of the theme's visual properties; properties without a value are\
                \ omitted."
              type: "object"
          type: "object"
        tables:
          additionalProperties:
            $ref: "#/components/schemas/TableMetaDataLight"
          description: "Map of all tables within the QQQ Instance (that the user has\
            \ permission to see that they exist)."
          type: "object"
        widgets:
          additionalProperties:
            properties:
              defaultValues:
                additionalProperties: true
                description: "Frontend widget defaults, including explicit association\
                  \ bindings"
                type: "object"
              dropdowns:
                description: "Dropdowns the widget offers to filter its data."
                type: "array"
              footerHTML:
                description: "HTML shown below the widget."
                type: "string"
              gridColumns:
                description: "Number of grid columns (of 12) the widget spans."
                type: "number"
              hasPermission:
                description: "Whether the user may render the widget."
                type: "object"
              helpContent:
                additionalProperties: true
                description: "Help content by role."
                type: "object"
              icon:
                description: "Name of the widget's icon."
                type: "string"
              icons:
                additionalProperties: true
                description: "Icons by role (for example the widget header icon)."
                type: "object"
              isCard:
                description: "Whether the widget is drawn as a card."
                type: "object"
              label:
                description: "User-facing name for this widget"
                type: "string"
              minHeight:
                description: "Minimum height of the widget (a CSS length)."
                type: "string"
              name:
                description: "Unique name for this widget within the QQQ Instance"
                type: "string"
              showExportButton:
                description: "Whether the widget offers an export button."
                type: "object"
              showReloadButton:
                description: "Whether the widget offers a reload button."
                type: "object"
              storeDropdownSelections:
                description: "Whether dropdown selections are remembered for the user."
                type: "object"
              tooltip:
                description: "Tooltip text for the widget."
                type: "string"
              type:
                description: "The type of this widget."
                type: "string"
            type: "object"
          description: "Map of all widgets within the QQQ Instance (that the user\
            \ has permission to see that they exist)."
          type: "object"
      type: "object"
    OrderBy:
