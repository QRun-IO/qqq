name: Published BOM consumer
'on':
  workflow_dispatch:
    inputs:
      version:
        description: Published QQQ release or candidate version
        required: true
        type: string
permissions:
  contents: read
jobs:
  verify:
    uses: QRun-IO/qqq-orb/.github/workflows/core-published-bom-consumer.yml@1c389210e6dfda1630d053c07ae4dae523dd5576
    with:
      version: ${{ inputs.version || '' }}
