  /qqq/v1/table/{tableName}/possibleValues/{fieldName}:
    post:
      description: "Search for possible values associated with a field on a table.\n\
        Returns a list of id/label pairs that match the given search criteria."
      parameters:
      - description: "Name of the table containing the field."
        example: "person"
        in: "path"
        name: "tableName"
        required: true
        schema:
          type: "string"
      - description: "Name of the field whose possible values should be searched."
        example: "partnerPersonId"
        in: "path"
        name: "fieldName"
        required: true
        schema:
          type: "string"
      requestBody:
        content:
          application/json:
            schema:
              properties:
                searchTerm:
                  description: "Text to search for within possible value labels"
                  type: "string"
                ids:
                  description: "List of specific ids to look up"
                  items:
                    type: "string"
                  type: "array"
                values:
                  description: "Map of other field values, used for filter interpolation\
                    \ on possible value source filters"
                  type: "object"
                useCase:
                  description: "Use case for possible value search filtering. Controls\
                    \ behavior when filter values are missing."
                  enum:
                  - "FORM"
                  - "FILTER"
                  type: "string"
                labels:
                  description: "List of specific labels to look up"
                  items:
                    type: "string"
                  type: "array"
                processValues:
                  description: "Map of field values from the current process step,\
                    \ used for filter interpolation"
                  type: "object"
                filter:
                  $ref: "#/components/schemas/QueryFilter"
                  description: "Optional default filter to apply to the possible value\
                    \ search"
                picker:
                  description: "Record picker request, for a possible value source\
                    \ that declares a picker: options carry the picker's display values\
                    \ and the response says whether more follow (no count)"
                  properties:
                    filter:
                      $ref: "#/components/schemas/QueryFilter"
                      description: "Criteria (only on the picker's filterFields) and\
                        \ orderBys (only on its sort fields or the primary key)"
                    afterId:
                      description: "Keyset paging: the last option id of the previous\
                        \ page, when ordered by the primary key alone"
                      type: "string"
                    skip:
                      description: "Offset paging, for orderings other than the primary\
                        \ key"
                      type: "integer"
                    limit:
                      description: "Options per page (default: the picker's pageSize;\
                        \ at most 200)"
                      type: "integer"
                  type: "object"
              type: "object"
        required: false
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PossibleValuesResponseV1"
          description: "List of possible value options matching the search criteria."
      security:
      - sessionUuidCookie:
        - "N/A"
      summary: "Search possible values for a table field"
      tags:
      - "Tables"
