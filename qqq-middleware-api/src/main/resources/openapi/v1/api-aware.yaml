        in: "query"
        name: "queryJoins"
        required: false
        schema:
          type: "string"
      - description: "For tables that use variant backends, JSON object naming the\
          \ variant to read from (the same `type` and `id` as in query requests)."
        example: "{\"type\":\"store\",\"id\":\"1\"}"
        in: "query"
        name: "tableVariant"
        required: false
        schema:
          type: "string"
      responses:
        200:
          content:
            application/json:
              examples:
                TODO:
                  value:
                    record:
                      displayValues:
                        id: "1"
                        firstName: "Darin"
                        lastName: "Kelkhoff"
                      recordLabel: "Darin Kelkhoff"
                      tableName: "person"
                      values:
                        id: 1
                        firstName: "Darin"
                        lastName: "Kelkhoff"
