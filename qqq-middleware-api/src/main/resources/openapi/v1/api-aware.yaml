  /qqq/v1/{applicationApiPath}/{applicationApiVersion}/search:
    post:
      description: "Search for records whose search fields (declared per table in\
        \ its meta-data, and listed as `searchFields` in the\ntable meta-data) match\
        \ a search term. String fields match when they contain the term, ignoring\
        \ case; integer\nfields match when they equal a numeric term. Only tables\
        \ that the user has permission to read are searched,\nrecord security locks\
        \ apply, and each table returns at most `limitPerTable` records (default 5,\
        \ maximum 25), after skipping `offset` matches in each table (for paging one\
        \ table).  An instance may have a record search\nprovider (e.g., a search\
        \ index) that searches some tables instead; if it fails, those tables are\
        \ searched with\nthe default search, and the response's `provider` and `tables`\
        \ say so.\n\nEach result can carry plain-text `highlights` of the fields that\
        \ match (with the matched spans as character\noffsets - never markup), `details`\
        \ (other search field values), `updatedAt` and, from a provider, a `score`.\n\
        Only fields the user may see are used.  All of these, and `tables` and `provider`,\
        \ are optional: clients must\ntolerate their absence."
      requestBody:
        content:
          application/json:
            schema:
              properties:
                searchTerm:
                  description: "Text to search for (required; at most 100 characters\
                    \ after trimming)."
                  example: "Kelkhoff"
                  type: "string"
                tableNames:
                  description: "Optional list of table names to search. When omitted\
                    \ or empty, every table with search fields is searched."
                  items:
                    type: "string"
                  type: "array"
                limitPerTable:
                  description: "Maximum number of records to return from each table."
                  type: "number"
                offset:
                  description: "Number of matches to skip in each table, for paging\
                    \ (default 0, maximum 1000).  Mainly useful with one table in\
                    \ tableNames."
                  type: "number"
                sort:
                  description: "Order of the results within each table: RELEVANCE\
                    \ (default) or RECENT (most recently modified first, for tables\
                    \ with a last-modified field)."
                  enum:
                  - "RELEVANCE"
                  - "RECENT"
                  type: "string"
              type: "object"
        required: true
      responses:
        200:
          content:
            application/json:
              examples:
                Matches in one table:
                  value:
                    provider:
                      status: "OK"
                    results:
                    - details:
                      - displayValue: "Saint Louis"
                        fieldLabel: "City"
                        fieldName: "city"
                      highlights:
                      - fieldLabel: "Email"
                        fieldName: "email"
                        matches:
                        - end: 14
                          start: 6
                        text: "darin.kelkhoff@example.com"
                      recordId: "1"
                      recordLabel: "Darin Kelkhoff"
                      score: 7.25
                      tableLabel: "Person"
                      tableName: "person"
                      updatedAt: "2026-10-01T14:30:00Z"
                    - recordId: "2"
                      recordLabel: "Tim Kelkhoff"
                      score: 6.5
                      tableLabel: "Person"
                      tableName: "person"
                    tables:
                    - hasMore: true
                      resultCount: 2
                      source: "PROVIDER"
                      tableLabel: "Person"
                      tableName: "person"
                      totalCount: 14
              schema:
                $ref: "#/components/schemas/RecordSearchResponseV1"
          description: "The records matching the search term"
      security:
      - sessionUuidCookie:
        - "N/A"
      summary: "Search records across tables"
      tags:
      - "Tables"
  /qqq/v1/{applicationApiPath}/{applicationApiVersion}/help/search:
