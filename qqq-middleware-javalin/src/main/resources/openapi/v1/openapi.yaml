        recordLabel:
          description: "Label to identify the record to a user."
          type: "string"
        tableName:
          description: "Name of the table that the record is from."
          type: "string"
        values:
          description: "Raw values that make up the record.  Keys are Strings, which\
            \ match the table's field names. Values can be any type, as per the table's\
            \ fields.  Single-record responses (get, insert, update) include fields\
            \ whose value is null; query results omit them."
          type: "object"
        warnings:
          description: "Messages for warnings on this record.  Omitted when there\
            \ are none."
          items:
            type: "string"
          type: "array"
      type: "object"
    PossibleValueOption:
