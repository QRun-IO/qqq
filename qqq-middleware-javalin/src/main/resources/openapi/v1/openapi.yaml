    patch:
      description: "Update an existing record in a table, identified by its primary\
        \ key. The request body should contain the field values to update."
      parameters:
      - description: "Optional optimistic version from the last read, encoded as a\
          \ string in the version field's format (ISO-8601 for modify dates). A mismatch\
          \ returns 409 RecordConflictV1 and leaves the record unchanged. Omit for\
          \ an unconditional update. Tables with recordVersionField set to an empty\
          \ string opt out."
        in: "query"
        name: "expectedVersion"
        required: false
        schema:
          type: "string"
      - description: "Name of the table containing the record to update."
        example: "person"
        in: "path"
        name: "tableName"
        required: true
        schema:
          type: "string"
      - description: "Primary key value of the record to update."
        example: "42"
        in: "path"
        name: "primaryKey"
        required: true
        schema:
          type: "string"
      requestBody:
        content:
          application/json:
            schema:
              description: "JSON object with field names as keys and field values\
                \ as values."
              properties:
                fieldName:
                  description: "Value for a field in the record. Repeat for each field\
                    \ to update."
                  type: "string"
              type: "object"
          multipart/form-data:
            schema:
              description: "Form fields named for the record's fields (an empty field\
                \ clears the value), a file for each blob field to set, and optionally\
                \ an `associations` field: JSON of association name to a list of associated\
                \ records.  With the request header `X-QQQ-Association-Format: record-v1`,\
                \ each associated record is `{\"values\": {...}, \"associations\"\
                : {...}}`, nested to any depth, and exactly one `associations` field\
                \ is required."
              properties:
                fieldName:
                  description: "Value for a field in the record. Repeat for each field\
                    \ to set."
                  type: "string"
                associations:
                  description: "JSON object of association name to a list of associated\
                    \ records."
                  type: "string"
              type: "object"
        required: false
      responses:
        200:
          content:
            application/json:
              examples:
                TODO:
                  value:
                    record:
                      displayValues:
                        id: "1"
                        firstName: "Darin"
                        lastName: "Kelkhoff"
                      recordLabel: "Darin Kelkhoff"
                      tableName: "person"
                      values:
                        id: 1
                        firstName: "Darin"
                        lastName: "Kelkhoff"
              schema:
                $ref: "#/components/schemas/TableUpdateResponseV1"
          description: "The record that was updated"
        409:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordConflictV1"
          description: "The record changed since it was read."
      security:
      - sessionUuidCookie:
        - "N/A"
      summary: "Update a record in a table"
      tags:
      - "Tables"
