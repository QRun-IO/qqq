<!doctype html>
<html lang="en-US">
<head>
   <title>{title}</title>
   <meta charset="utf-8">
   <!-- <script type="module" src="https://unpkg.com/rapidoc/dist/rapidoc-min.js"></script> -->
   <script type="module" src="/api/docs/js/rapidoc.min.js"></script>
   <link rel="stylesheet" href="/api/docs/css/qqq-api-styles.css">
</head>
<body>
<rapi-doc
        id="the-rapi-doc"
        spec-url="{spec-url}"
        regular-font="SF Pro Display,Roboto,Helvetica,Arial,sans-serif"
        mono-font="Monaco, Menlo, Consolas, source-code-pro, monospace"
        font-size="large"
        show-header="false"
        allow-spec-file-download="true"
        primary-color="{primaryColor}"
        sort-endpoints-by="none"
        allow-authentication="true"
        persist-auth="true"
        render-style="focused"
        show-method-in-nav-bar="as-colored-block"
        nav-item-spacing="relaxed"
        css-file="qqq-api-styles.css"
        css-classes="qqqApi"
        info-description-headings-in-navbar="true"
        show-curl-before-try="true"
>
   {navLogoImg}
   <div slot="overview" id="otherVersions">
      <label for="otherApisSelect">Other APIs:</label>
      <select id="otherApisSelect" onchange=changeApi()>
         <option value="/api/">--</option>
         {otherApisOptions}
      </select>
      <label for="otherVersionsSelect">Other Versions of this API:</label>
      <select id="otherVersionsSelect" onchange=changeVersion()>
         <option value="/api/">--</option>
         {otherVersionOptions}
      </select>
   </div>
</rapi-doc>
<script>
   window.addEventListener('DOMContentLoaded', (event) => {
      const rapidocEl = document.getElementById('the-rapi-doc');
      rapidocEl.addEventListener('spec-loaded', (e) => {

         const shadowRoot = rapidocEl.shadowRoot;
         const collapseButton = shadowRoot.querySelector(".nav-bar-collapse-all");
         if(collapseButton)
         {
            collapseButton.click();
         }

         const otherVersions = document.querySelector("#otherVersions");
         if(otherVersions)
         {
            otherVersions.style.visibility = "visible";
         }

         const navLogo = document.querySelector("#navLogo");
         if(navLogo)
         {
            navLogo.style.visibility = "visible";
         }
      });
   });

   function safeNavigate(url)
   {
      // Security: Only allow same-origin API paths (e.g., /api/v1/docs/)
      // Pattern: must start with slash followed by safe path characters
      if (url && typeof url === 'string' && /^\/[a-zA-Z0-9\/._-]*\/?$/.test(url))
      {
         window.location.href = url;
      }
   }

   function changeApi()
   {
      safeNavigate(document.getElementById("otherApisSelect").value);
   }

   function changeVersion()
   {
      safeNavigate(document.getElementById("otherVersionsSelect").value);
   }
</script>
</body>
</html>
