name: Public quickstart lifecycle
'on':
  push:
    tags:
    - quickstart-4.1.0-RC.1
  workflow_dispatch:
    inputs:
      version:
        description: Exact public candidate to verify
        required: true
        type: choice
        options:
        - 4.1.0-RC.1
      source_sha:
        description: Full reviewed commit of the immutable quickstart tag
        required: true
        type: string
      boundary_capture:
        description: Diagnose one macOS15 WebKit lifecycle with private boundary evidence
        required: false
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  lifecycle:
    uses: QRun-IO/qqq-orb/.github/workflows/core-quickstart-lifecycle.yml@0f33ddadf88b9a1b940b8883782fe2000ee1d2bd
    with:
      version: ${{ inputs.version || '' }}
      source_sha: ${{ inputs.source_sha || '' }}
      boundary_capture: ${{ inputs.boundary_capture || false }}
