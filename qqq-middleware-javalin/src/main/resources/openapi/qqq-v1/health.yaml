        - "profile"
        - "email"
      summary: "Health history"
      tags:
      - "Health"
  /qqq/v1/health/checks/{name}/run:
    post:
      description: "Requires health.write permission. Returns redacted health state."
      operationId: "postHealthChecksByNameRun"
      parameters:
      - description: "Stable health check or component name."
        in: "path"
        name: "name"
        required: true
        schema:
          type: "string"
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthRunV1"
          description: "Successful Response"
        400:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Bad request: a parameter or the body is invalid (code BAD_REQUEST);\
            \ fieldErrors may name the fields."
        401:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Not authenticated, or the session or token is invalid or expired\
            \ (code UNAUTHENTICATED). Sign in again, or refresh the token."
        403:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "The user (or the credential's scope) may not do this (code\
            \ PERMISSION_DENIED)."
        404:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Not found, or not visible to this user (code NOT_FOUND)."
        409:
          content:
            application/json:
              schema:
