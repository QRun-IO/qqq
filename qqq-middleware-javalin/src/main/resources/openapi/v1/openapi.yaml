                      - tableName: "scriptRevision"
                        values:
                          id: 12
                          scriptId: 7
                          sequenceNo: 2
                          commitMessage: "Say hello by name"
                      scriptType:
                        recordLabel: "Greeting"
                        tableName: "scriptType"
                        values:
                          id: 1
                          name: "Greeting"
