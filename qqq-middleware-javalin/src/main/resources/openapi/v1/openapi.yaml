        basePath:
          description: "Base path of this API version, e.g. /qqq/v1."
          type: "string"
        clientChannels:
          description: "Client channel names the server accepts in the X-QQQ-Client\
            \ request header (`channel[/detail]`, e.g. next-ui, assistant/<turnId>).\
            \ A client names itself on every request; it is recorded in audits and\
            \ some objects are denied to some channels. The actor is always the signed-in\
            \ user; a channel never grants anything."
          items:
            type: "string"
          type: "array"
        extensions:
          description: "Extensions (modules and qbits) registered on this server,\
            \ each with its own path prefix and semantic version."
          items:
            $ref: "#/components/schemas/UiApiExtensionInfo"
          type: "array"
        features:
          description: "Names of the optional core features this server supports,\
            \ so a client can show or hide an area without probing."
          items:
            type: "string"
          type: "array"
        supportedMajorVersions:
          description: "The major versions of the UI API this server serves."
          items:
            type: "number"
          type: "array"
      type: "object"
