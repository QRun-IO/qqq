info:
  contact:
    email: "contact@kingsrook.com"
  description: "## Intro\nThis is the definition of the standard API implemented by\
    \ QQQ Middleware.\n\nDevelopers of QQQ Frontends (e.g., javascript libraries,\
    \ or native applications) use this API to access\na QQQ Backend server.\n\nAs\
    \ such, this API itself is not concerned with any of the application-level details\
    \ of any particular\napplication built using QQQ.  Instead, this API is all about\
    \ the generic endpoints used for any application\nbuilt on QQQ.  For example,\
    \ many endpoints work with a `${table}` path parameter - whose possible values\n\
    are defined by the application - but which are not known to this API.\n\n## Flow\n\
    The typical flow of a user (as implemented in a frontend that utilizes this API)\
    \ looks like:\n1. Frontend calls `.../metaData/authentication`, to know what type\
    \ of authentication provider is used by the backend, and display an appropriate\
    \ UI to the user for authenticating.\n2. User authenticates in frontend, as required\
    \ for the authentication provider.\n3. Frontend calls `.../manageSession`, providing\
    \ authentication details (e.g., an accessToken or other credentials) to the backend.\n\
    4. The response from the `manageSession` call (assuming success), sets the `sessionUUID`\
    \ Cookie, which should be included in all subsequent requests for authentication.\n\
    5. After the user is authenticated, the frontend calls `.../metaData`, to discover\
    \ the apps, tables, processes, etc, that the application is made up of (and that\
    \ the authenticated user has permission to access).\n6. As the user interacts\
    \ with apps, tables, process, etc, the frontend utilizes the appropriate endpoints\
    \ as required.\n\n## Client channel\nEvery request should name its client in the\
    \ `X-QQQ-Client` header: `channel[/detail]`, e.g. `next-ui`, `cli`,\nor `assistant/<turnId>`\
    \ (the accepted channels are listed by `GET .../version`; an unknown one is refused\
    \ with 400).\nThe channel is recorded in audits.  It is attribution only: the\
    \ actor is always the signed-in user, and a channel\nnever grants anything - but\
    \ some objects are denied to some channels (e.g. the AI assistant can never see\
    \ its own\nconfiguration, identity and permission administration, audits, API\
    \ keys or secrets), exactly as if the user had\nno permission for them.\n"
  title: "QQQ Middleware API"
  version: "1.4.0"
openapi: "3.0.3"
paths:
  /qqq/v1/{applicationApiPath}/{applicationApiVersion}/version:
    get:
      description: "Describes the semantic version of this UI API (MAJOR.MINOR.PATCH,\
        \ where MAJOR matches the URL\nversion), the optional core features the server\
        \ supports, and the extensions (modules and qbits)\nregistered on it, each\
        \ with its own semantic version.\n\nA client should call this first, before\
        \ authentication, and stop with a clear message when\napiVersion is outside\
        \ the range it supports.  Not secured."
      responses:
        200:
          content:
            application/json:
              examples:
                Server with one extension:
                  value:
                    apiVersion: "1.1.0"
                    basePath: "/qqq/v1"
                    extensions:
                    - description: "ESB overview, destinations, messages and dead\
                        \ letters"
                      name: "esb"
                      pathPrefix: "/esb"
                      version: "1.0.0"
                    features:
                    - "recordSearch"
                    - "tableVariants"
                    - "version"
                    supportedMajorVersions:
                    - 1
              schema:
                $ref: "#/components/schemas/VersionResponseV1"
          description: "Successful Response"
      summary: "Get the UI API version"
      tags:
      - "General"
  /qqq/v1/{applicationApiPath}/{applicationApiVersion}/realtime/stream:
    get:
      description: "SSE invalidation hints. Each event has id <connectionId>:<sequence>,\
        \ an event name and JSON data. hello identifies the connection; comment pings\
        \ maintain it. Last-Event-ID replays retained events on the same pod and session,\
        \ otherwise resync asks clients to refetch. Core event payloads use the Realtime*EventV1\
        \ components. Qbits publish through RealtimeBus with their own event names,\
        \ such as presence.changed and comment.added, described by RealtimeEventV1.\
        \ Subscriptions require a separate POST; session-ended closes the stream and\
        \ channel-revoked removes a subscription."
      parameters:
      - description: "Last received <connectionId>:<sequence> cursor."
        in: "header"
        name: "Last-Event-ID"
        required: false
        schema:
          type: "string"
      responses:
        200:
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/RealtimeEventV1"
          description: "Realtime named events and comment heartbeats."
      security:
      - sessionUuidCookie:
        - "N/A"
      summary: "Open the realtime event stream"
      tags:
      - "General"
  /qqq/v1/{applicationApiPath}/{applicationApiVersion}/realtime/subscriptions:
    post:
      description: "Add or remove record:{table}:{pk}, table:{table}, user:me, or\
        \ instance channels. Records require a permission-checked GetAction and tables\
        \ require READ. Refusals give no reason. The connection must belong to the\
        \ authenticated session; otherwise 404. Active user channels are returned\
        \ as user:me. Channel limits apply."
      requestBody:
        content:
          application/json:
            schema:
              properties:
                add:
                  items:
                    type: "string"
                  type: "array"
                connectionId:
                  type: "string"
                remove:
                  items:
                    type: "string"
                  type: "array"
              type: "object"
        required: false
      responses:
        400:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Malformed subscription request."
        404:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Connection not found."
        200:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RealtimeSubscriptionResponseV1"
          description: "Current subscriptions and refused additions."
      security:
      - sessionUuidCookie:
        - "N/A"
      summary: "Change realtime subscriptions"
      tags:
      - "General"
  /qqq/v1/{applicationApiPath}/{applicationApiVersion}/metaData/authentication:
    get:
      description: "For a frontend to determine which authentication provider or mechanism\
        \ to use, it should begin its lifecycle\nby requesting this metaData object,\
        \ and inspecting the `type` property in the response.\n\nNote that this endpoint\
        \ is not secured, as its purpose is to be called as part of the workflow that\
        \ results\nin a user being authenticated."
      responses:
        200:
          content:
            application/json:
              examples:
                For FULLY_ANONYMOUS type:
                  value:
                    name: "anonymous"
                    type: "FULLY_ANONYMOUS"
                For AUTH_0 type:
                  value:
                    name: "auth0"
                    type: "AUTH_0"
                    values:
                      audience: "myapp.mydomain.com"
                      baseUrl: "https://myapp.auth0.com/"
                      clientId: "abcdefg1234567"
              schema:
                $ref: "#/components/schemas/AuthenticationMetaDataResponseV1"
          description: "Successful Response"
      summary: "Get authentication metaData"
      tags:
      - "Authentication"
  /qqq/v1/{applicationApiPath}/{applicationApiVersion}/manageSession:
    post:
      description: "After a frontend authenticates the user as per the requirements\
        \ of the authentication provider specified by the\n`type` field in the `metaData/authentication`\
        \ response, data from that authentication provider should be posted\nto this\
        \ endpoint, to create a session within the QQQ application.\n\nThe response\
        \ object will include a session identifier (`uuid`) to authenticate the user\
        \ in subsequent API calls.\n\nFor the `TABLE_BASED` type, send the user's\
        \ credentials in an `Authorization: Basic` header (base64 of\n`username:password`,\
        \ UTF-8); the body may be empty.  The password is verified against the user\
        \ table and a\nsession row is stored; a `401` response means the credentials\
        \ were refused.\n\nTo resume the session the browser already holds (for example\
        \ after a page reload), post an empty object:\na request with no credentials\
        \ and no `sessionUUID` resumes the session named by the `sessionUUID` cookie,\n\
        which may be `HttpOnly`.  That response carries the session's `values` but\
        \ not its `uuid`; a `401`\nresponse means there is no valid session to resume."
      parameters:
      - description: "For `TABLE_BASED` authentication: `Basic ` followed by the base64\
          \ encoding of `username:password` (UTF-8).\nNot used by other authentication\
          \ types."
        example: "Basic dXNlcm5hbWU6cGFzc3dvcmQ="
        in: "header"
        name: "Authorization"
        schema:
          type: "string"
      requestBody:
        content:
          application/json:
            schema:
              description: "Data required to create the session.  Specific needs may\
                \ vary based on the AuthenticationModule type in the QQQ Backend."
              properties:
                accessToken:
                  description: "An access token from a downstream authentication provider\
                    \ (e.g., Auth0), to use as the basis for authentication and authorization."
                  type: "string"
                code:
                  description: "OAuth2 authorization code, for the backend to exchange\
                    \ with the identity provider (authorization-code + PKCE sign-in)."
                  type: "string"
                codeVerifier:
                  description: "PKCE code verifier that goes with `code`."
                  type: "string"
                redirectUri:
                  description: "Redirect URI the authorization `code` was issued to."
                  type: "string"
                sessionUUID:
                  description: "UUID of an existing session, to resume it instead\
                    \ of signing in again.  Omit it (and all credentials) to resume\
                    \ the session named by the sessionUUID cookie."
                  type: "string"
              type: "object"
        required: true
      responses:
        401:
          content:
            application/json:
              examples:
                Invalid token:
                  value:
                    error: "Unable to decode access token."
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Authentication error - session was not created"
        200:
          content:
            application/json:
              examples:
                With no custom values:
                  value:
                    uuid: "01234567-89AB-CDEF-0123-456789ABCDEF"
                With custom values:
                  value:
                    uuid: "98765432-10FE-DCBA-9876-543210FEDCBA"
                    values:
                      region: "US"
                      userCategoryId: 47
              schema:
                $ref: "#/components/schemas/ManageSessionResponseV1"
          description: "Successful response - session has been created"
      summary: "Create a session"
      tags:
      - "Authentication"
  /qqq/v1/{applicationApiPath}/{applicationApiVersion}/logout:
    post:
      description: "Invalidates the current session server-side, deleting it from\
        \ the session store\nand clearing any cached data. The session cookie is also\
        \ removed.\n\nFrontends should call this endpoint before performing client-side\
        \ logout\n(clearing localStorage, redirecting to IdP logout, etc.) to ensure\
        \ the\nsession cannot be resumed."
      responses:
        200:
          content:
            application/json:
              examples:
                Successful logout: {}
              schema:
                $ref: "#/components/schemas/LogoutResponseV1"
          description: "Session has been invalidated"
      summary: "Logout and invalidate session"
      tags:
      - "Authentication"
  /qqq/v1/{applicationApiPath}/{applicationApiVersion}/oidc/backchannel-logout:
    post:
      description: "Receives logout notifications from the Identity Provider (IdP)\
        \ when a user\nlogs out from the IdP or another application in the SSO ecosystem.\n\
        \nThe IdP sends a POST request with a 'logout_token' JWT parameter containing\n\
        either a 'sub' (subject) or 'sid' (session ID) claim. QQQ validates the RS256\n\
        signature against the configured OAuth2 provider's discovered JWKS, issuer,\n\
        client audience, logout event and timestamps before deleting matching sessions\n\
        from the configured session table. Both subject and session ID must match\
        \ when\nboth are present. Invalid tokens or unsupported configuration return\
        \ HTTP 400.\n\nThis endpoint should be registered with your IdP as the back-channel\
        \ logout URI."
      responses:
        200:
          content:
            application/json:
              examples:
                Successful logout: {}
              schema:
                $ref: "#/components/schemas/BackChannelLogoutResponseV1"
          description: "Back-channel logout processed successfully"
      summary: "OIDC Back-Channel Logout"
      tags:
      - "Authentication"
