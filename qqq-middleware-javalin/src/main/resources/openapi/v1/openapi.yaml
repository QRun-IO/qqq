  /qqq/v1/processes/{processName}/init:
    post:
      description: "For a user to start running a process, this endpoint should be\
        \ called, to start the process\nand run its first step(s) (any backend steps\
        \ before the first frontend step).\n\nAdditional process-specific values should\
        \ posted in a form param named `values`, as JSON object\nwith keys defined\
        \ by the process in question.\n\nFor a process which needs to operate on a\
        \ set of records that a user selected, see\n`recordsParam`, and `recordIds`\
        \ or `filterJSON`.\n\nThe response will include a `processUUID`, to be included\
        \ in all subsequent requests relevant\nto the process.\n\nNote that this request,\
        \ if it takes longer than a given threshold* to complete, will return a\n\
        a `jobUUID`, which should be sent to the `/processes/{processName}/{processUUID}/status/{jobUUID}`\n\
        endpoint, to poll for a status update.\n\n*This threshold has a default value\
        \ of 3,000 ms., but can be set per-request via the form\nparameter `stepTimeoutMillis`.\n"
      parameters:
      - description: "Name of the process to initialize"
        example: "samplePersonProcess"
        in: "path"
        name: "processName"
        required: true
        schema:
          type: "string"
      - description: "For processes on tables that use variant backends, JSON object\
          \ naming the variant to use (the same `type` and `id` as in table requests)."
        example: "{\"type\":\"store\",\"id\":\"1\"}"
        in: "query"
        name: "tableVariant"
        required: false
        schema:
          type: "string"
      requestBody:
        content:
          multipart/form-data:
            schema:
              properties:
                values:
                  description: "Process-specific field names and values."
                  type: "object"
                recordsParam:
                  description: "Specifies which other query-param will contain the\
                    \ indicator of initial records to pass in to the process."
                  examples:
                    recordIds:
                      value: "recordIds"
                    filterJSON:
                      value: "recordIds"
                  type: "string"
                recordIds:
                  description: "Comma-separated list of ids from the table this process\
                    \ is based on, to use as input records for the process.  Needs\
                    \ `recordsParam=recordIds` value to be given as well."
                  examples:
                    one id:
                      value: "1701"
                    multiple ids:
                      value: "42,47"
                  type: "string"
                filterJSON:
                  description: "JSON encoded QQueryFilter object, to execute against\
                    \ the table this process is based on, to find input records for\
                    \ the process.  Needs `recordsParam=filterJSON` value to be given\
                    \ as well."
                  examples:
                    empty filter (all records):
                      value: "{}"
                    filter by a condition:
                      value: "{\"criteria\":[{\"fieldName\":\"id\",\"operator\":\"\
                        LESS_THAN\",\"values\":[10]}],\"booleanOperator\":\"AND\"}"
                  type: "string"
                stepTimeoutMillis:
                  description: "Optionally change the time that the server will wait\
                    \ for the job before letting it go asynchronous.  Default value\
                    \ is 3000."
                  examples:
                    shorter timeout:
                      value: "500"
                    longer timeout:
                      value: "60000"
                  type: "integer"
                file:
                  description: "A file upload, for processes which expect to be initialized\
                    \ with an uploaded file."
                  format: "binary"
                  type: "string"
                tableVariant:
                  description: "For processes on tables that use variant backends,\
                    \ JSON object naming the variant to use (the same `type` and `id`\
                    \ as in table requests).  May also be given as a query parameter."
                  example: "{\"type\":\"store\",\"id\":\"1\"}"
                  type: "string"
              type: "object"
        required: false
      responses:
        200:
          content:
            application/json:
              examples:
                COMPLETE:
                  value:
                    values:
                      firstLastName: "Aabramson"
                      totalAge: 32768
                    processUUID: "01234567-89AB-CDEF-0123-456789ABCDEF"
                    nextStep: "reviewScreen"
                    type: "COMPLETE"
                COMPLETE with metaDataAdjustment:
                  value:
                    values:
                      firstLastName: "Aabramson"
                      totalAge: 32768
                    processUUID: "01234567-89AB-CDEF-0123-456789ABCDEF"
                    nextStep: "inputScreen"
                    processMetaDataAdjustment:
                      updatedFields:
                        someField:
                          isRequired: true
                          isEditable: true
                          name: "someField"
                          displayFormat: "%s"
                          type: "STRING"
                          isHeavy: false
                          isHidden: false
                      updatedFrontendStepList:
                      - components:
                        - type: "EDIT_FORM"
                        name: "inputScreen"
                        formFields:
                        - isRequired: false
                          isEditable: true
                          name: "someField"
                          displayFormat: "%s"
                          type: "STRING"
                          isHeavy: false
                          isHidden: false
                      - components:
                        - type: "PROCESS_SUMMARY_RESULTS"
                        name: "resultScreen"
                    type: "COMPLETE"
                JOB_STARTED:
                  value:
                    jobUUID: "98765432-10FE-DCBA-9876-543210FEDCBA"
                    processUUID: "01234567-89AB-CDEF-0123-456789ABCDEF"
                    type: "JOB_STARTED"
                RUNNING:
                  value:
                    current: 47
                    total: 1701
                    processUUID: "01234567-89AB-CDEF-0123-456789ABCDEF"
                    type: "RUNNING"
                    message: "Processing person records"
                ERROR:
                  value:
                    processUUID: "01234567-89AB-CDEF-0123-456789ABCDEF"
                    type: "RUNNING"
              schema:
                $ref: "#/components/schemas/ProcessStepResponseV1"
          description: "State of the initialization of the job, with different fields\
            \ set, based on the\nstatus of the task."
      security:
      - sessionUuidCookie:
        - "N/A"
      summary: "Initialize a process"
      tags:
      - "Processes"
  /qqq/v1/processes/{processName}/{processUUID}/step/{stepName}:
    post:
      description: "To run the next step in a process, this endpoint should be called,\
        \ with the `processName`\nand existing `processUUID`, as well as the step\
        \ that was just completed in the frontend,\ngiven as `stepName`.\n\nAdditional\
        \ process-specific values should posted in a form param named `values`, as\
        \ JSON object\nwith keys defined by the process in question.\n\nNote that\
        \ this request, if it takes longer than a given threshold* to complete, will\
        \ return a\na `jobUUID`, which should be sent to the `/processes/{processName}/{processUUID}/status/{jobUUID}`\n\
        endpoint, to poll for a status update.\n\n*This threshold has a default value\
        \ of 3,000 ms., but can be set per-request via the form\nparameter `stepTimeoutMillis`.\n"
      parameters:
      - description: "Name of the process to perform the step in."
        example: "samplePersonProcess"
        in: "path"
        name: "processName"
        required: true
        schema:
          type: "string"
      - description: "Unique identifier for this run of the process - as was returned\
          \ by the `init` call."
        example: "01234567-89AB-CDEF-0123-456789ABCDEF"
        in: "path"
        name: "processUUID"
        required: true
        schema:
          type: "string"
      - description: "Name of the frontend step that the user has just completed."
        example: "inputForm"
        in: "path"
        name: "stepName"
        required: true
        schema:
          type: "string"
      - description: "For processes on tables that use variant backends, JSON object\
          \ naming the variant to use (the same `type` and `id` as in table requests)."
        example: "{\"type\":\"store\",\"id\":\"1\"}"
        in: "query"
        name: "tableVariant"
        required: false
        schema:
          type: "string"
      requestBody:
        content:
          multipart/form-data:
            schema:
              properties:
                values:
                  description: "Process-specific field names and values."
                  type: "object"
                stepTimeoutMillis:
                  description: "Optionally change the time that the server will wait\
                    \ for the job before letting it go asynchronous.  Default value\
                    \ is 3000."
                  examples:
                    shorter timeout:
                      value: "500"
                    longer timeout:
                      value: "60000"
                  type: "integer"
                file:
                  description: "A file upload, for process steps which expect an uploaded\
                    \ file."
                  format: "binary"
                  type: "string"
                tableVariant:
                  description: "For processes on tables that use variant backends,\
                    \ JSON object naming the variant to use (the same `type` and `id`\
                    \ as in table requests).  May also be given as a query parameter."
                  example: "{\"type\":\"store\",\"id\":\"1\"}"
                  type: "string"
              type: "object"
        required: false
      responses:
        200:
          content:
            application/json:
              examples:
                COMPLETE:
                  value:
                    values:
                      firstLastName: "Aabramson"
                      totalAge: 32768
                    processUUID: "01234567-89AB-CDEF-0123-456789ABCDEF"
                    nextStep: "reviewScreen"
                    type: "COMPLETE"
                COMPLETE with metaDataAdjustment:
                  value:
                    values:
                      firstLastName: "Aabramson"
                      totalAge: 32768
                    processUUID: "01234567-89AB-CDEF-0123-456789ABCDEF"
                    nextStep: "inputScreen"
                    processMetaDataAdjustment:
                      updatedFields:
                        someField:
                          isRequired: true
                          isEditable: true
                          name: "someField"
                          displayFormat: "%s"
                          type: "STRING"
                          isHeavy: false
                          isHidden: false
                      updatedFrontendStepList:
                      - components:
                        - type: "EDIT_FORM"
                        name: "inputScreen"
                        formFields:
                        - isRequired: false
                          isEditable: true
                          name: "someField"
                          displayFormat: "%s"
                          type: "STRING"
                          isHeavy: false
                          isHidden: false
                      - components:
                        - type: "PROCESS_SUMMARY_RESULTS"
                        name: "resultScreen"
                    type: "COMPLETE"
                JOB_STARTED:
                  value:
                    jobUUID: "98765432-10FE-DCBA-9876-543210FEDCBA"
                    processUUID: "01234567-89AB-CDEF-0123-456789ABCDEF"
                    type: "JOB_STARTED"
                RUNNING:
                  value:
                    current: 47
                    total: 1701
                    processUUID: "01234567-89AB-CDEF-0123-456789ABCDEF"
                    type: "RUNNING"
                    message: "Processing person records"
                ERROR:
                  value:
                    processUUID: "01234567-89AB-CDEF-0123-456789ABCDEF"
                    type: "RUNNING"
              schema:
                $ref: "#/components/schemas/ProcessStepResponseV1"
          description: "State of the backend's running of the next step(s) of the\
            \ job, with different fields set,\nbased on the status of the job."
      security:
      - sessionUuidCookie:
        - "N/A"
      summary: "Run a step in a process"
      tags:
      - "Processes"
  /qqq/v1/processes/{processName}/{processUUID}/status/{jobUUID}:
    get:
      description: "Get the status of a running job for a process.\n\nResponse is\
        \ the same format as for an init or step call that completed synchronously.\n"
      parameters:
      - description: "Name of the process that is being ran"
        example: "samplePersonProcess"
        in: "path"
        name: "processName"
        required: true
        schema:
          type: "string"
      - description: "Unique identifier for this run of the process - as was returned\
          \ by the `init` call."
        example: "01234567-89AB-CDEF-0123-456789ABCDEF"
        in: "path"
        name: "processUUID"
        required: true
        schema:
          format: "uuid"
          type: "string"
      - description: "Unique identifier for the asynchronous job being executed, as\
          \ returned by an `init` or `step` call that went asynch."
        example: "98765432-10FE-DCBA-9876-543210FEDCBA"
        in: "path"
        name: "jobUUID"
        required: true
        schema:
          format: "uuid"
          type: "string"
      - description: "For processes on tables that use variant backends, JSON object\
          \ naming the variant to use (the same `type` and `id` as in table requests)."
        example: "{\"type\":\"store\",\"id\":\"1\"}"
        in: "query"
        name: "tableVariant"
        required: false
        schema:
          type: "string"
      responses:
        200:
          content:
            application/json:
              examples:
                COMPLETE:
                  value:
                    values:
                      firstLastName: "Aabramson"
                      totalAge: 32768
                    processUUID: "01234567-89AB-CDEF-0123-456789ABCDEF"
                    nextStep: "reviewScreen"
                    type: "COMPLETE"
                COMPLETE with metaDataAdjustment:
                  value:
                    values:
                      firstLastName: "Aabramson"
                      totalAge: 32768
                    processUUID: "01234567-89AB-CDEF-0123-456789ABCDEF"
                    nextStep: "inputScreen"
                    processMetaDataAdjustment:
                      updatedFields:
                        someField:
                          isRequired: true
                          isEditable: true
                          name: "someField"
                          displayFormat: "%s"
                          type: "STRING"
                          isHeavy: false
                          isHidden: false
                      updatedFrontendStepList:
                      - components:
                        - type: "EDIT_FORM"
                        name: "inputScreen"
                        formFields:
                        - isRequired: false
                          isEditable: true
                          name: "someField"
                          displayFormat: "%s"
                          type: "STRING"
                          isHeavy: false
                          isHidden: false
                      - components:
                        - type: "PROCESS_SUMMARY_RESULTS"
                        name: "resultScreen"
                    type: "COMPLETE"
                JOB_STARTED:
                  value:
                    jobUUID: "98765432-10FE-DCBA-9876-543210FEDCBA"
                    processUUID: "01234567-89AB-CDEF-0123-456789ABCDEF"
                    type: "JOB_STARTED"
                RUNNING:
                  value:
                    current: 47
                    total: 1701
                    processUUID: "01234567-89AB-CDEF-0123-456789ABCDEF"
                    type: "RUNNING"
                    message: "Processing person records"
                ERROR:
                  value:
                    processUUID: "01234567-89AB-CDEF-0123-456789ABCDEF"
                    type: "RUNNING"
              schema:
                $ref: "#/components/schemas/ProcessStepResponseV1"
          description: "State of the backend's running of the specified job, with\
            \ different fields set,\nbased on the status of the job."
      security:
      - sessionUuidCookie:
        - "N/A"
      summary: "Get job status"
      tags:
      - "Processes"
  /qqq/v1/processes/{processName}/{processUUID}/records:
    get:
      description: "Retrieve the records associated with a running or completed process,\
        \ with support\nfor pagination via skip and limit query parameters."
      parameters:
      - description: "Name of the process"
        example: "samplePersonProcess"
        in: "path"
        name: "processName"
        required: true
        schema:
          type: "string"
      - description: "Unique identifier for this run of the process"
        example: "01234567-89AB-CDEF-0123-456789ABCDEF"
        in: "path"
        name: "processUUID"
        required: true
        schema:
          format: "uuid"
          type: "string"
      - description: "Number of records to skip (default 0)"
        example: "0"
        in: "query"
        name: "skip"
        required: false
        schema:
          type: "integer"
      - description: "Maximum number of records to return (default 20)"
        example: "20"
        in: "query"
        name: "limit"
        required: false
        schema:
          type: "integer"
      - description: "For processes on tables that use variant backends, JSON object\
          \ naming the variant to use (the same `type` and `id` as in table requests)."
        example: "{\"type\":\"store\",\"id\":\"1\"}"
        in: "query"
        name: "tableVariant"
        required: false
        schema:
          type: "string"
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessRecordsResponseV1"
          description: "Paginated list of records from the process state."
      security:
      - sessionUuidCookie:
        - "N/A"
      summary: "Get records from a process"
      tags:
      - "Processes"
  /qqq/v1/processes/{processName}/{processUUID}/cancel:
    post:
      description: "Cancel a running process. If the process defines a cancel step,\
        \ it will be executed."
      parameters:
      - description: "Name of the process to cancel"
        example: "samplePersonProcess"
        in: "path"
        name: "processName"
        required: true
        schema:
          type: "string"
      - description: "Unique identifier for this run of the process"
        example: "01234567-89AB-CDEF-0123-456789ABCDEF"
        in: "path"
        name: "processUUID"
        required: true
        schema:
          format: "uuid"
          type: "string"
      - description: "For processes on tables that use variant backends, JSON object\
          \ naming the variant to use (the same `type` and `id` as in table requests)."
        example: "{\"type\":\"store\",\"id\":\"1\"}"
        in: "query"
        name: "tableVariant"
        required: false
        schema:
          type: "string"
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessCancelResponseV1"
          description: "Empty JSON object indicating successful cancellation."
      security:
      - sessionUuidCookie:
        - "N/A"
      summary: "Cancel a running process"
      tags:
      - "Processes"
  /qqq/v1/table/{tableName}/export:
    post:
      description: "Export records from a table as a downloadable file in the specified\
        \ format (CSV, XLSX, JSON, TSV)."
      parameters:
      - description: "Name of the table to export."
        example: "person"
        in: "path"
        name: "tableName"
        required: true
        schema:
          type: "string"
      requestBody:
        content:
          application/json:
            schema:
              properties:
                format:
                  description: "Export format: csv, xlsx, json, tsv"
                  type: "string"
                filename:
                  description: "Optional filename for the download. Generated if absent."
                  type: "string"
                filter:
                  $ref: "#/components/schemas/QueryFilter"
                  description: "QueryFilter to specify matching records to export"
                fieldNames:
                  description: "Optional subset of field names to include in the export"
                  items:
                    type: "string"
                  type: "array"
                limit:
                  description: "Optional maximum number of records to export"
                  type: "integer"
                includeHeaderRow:
                  description: "Whether to include a header row (default true)"
                  type: "boolean"
                tableVariant:
                  $ref: "#/components/schemas/TableVariant"
                  description: "For tables that use variant backends, the variant\
                    \ to export from (the same `type` and `id` as in query requests)."
              type: "object"
        required: false
      responses:
        200:
          content:
            application/octet-stream:
              schema:
                format: "binary"
                type: "string"
          description: "Binary file content in the requested export format"
      security:
      - sessionUuidCookie:
        - "N/A"
      summary: "Export records from a table"
      tags:
      - "Tables"
  /qqq/v1/table/{tableName}/{primaryKey}/{fieldName}/{filename}:
    get:
      description: "Download the binary content of a blob field from a specific record."
      parameters:
      - description: "Name of the table containing the record."
        example: "person"
        in: "path"
        name: "tableName"
        required: true
        schema:
          type: "string"
      - description: "Primary key value of the record."
        example: "42"
        in: "path"
        name: "primaryKey"
        required: true
        schema:
          type: "string"
      - description: "Name of the field to download."
        example: "photo"
        in: "path"
        name: "fieldName"
        required: true
        schema:
          type: "string"
      - description: "Filename for the downloaded content."
        example: "photo.jpg"
        in: "path"
        name: "filename"
        required: true
        schema:
          type: "string"
      responses:
        200:
          content:
            application/octet-stream:
              schema:
                format: "binary"
                type: "string"
          description: "Binary file content"
      security:
      - sessionUuidCookie:
        - "N/A"
      summary: "Download a field value from a record"
      tags:
      - "Tables"
  /qqq/v1/download/{file}:
    get:
      description: "Download a file from server-side storage by file path or storage\
        \ table reference."
      parameters:
      - description: "Filename for the download."
        example: "report.csv"
        in: "path"
        name: "file"
        required: true
        schema:
          type: "string"
      - description: "Server-side file path to download from."
        in: "query"
        name: "filePath"
        required: false
        schema:
          type: "string"
      - description: "Name of the storage table to download from."
        in: "query"
        name: "storageTableName"
        required: false
        schema:
          type: "string"
      - description: "Storage reference key for the file."
        in: "query"
        name: "storageReference"
        required: false
        schema:
          type: "string"
      responses:
        200:
          content:
            application/octet-stream:
              schema:
                format: "binary"
                type: "string"
          description: "Binary file content"
      security:
      - sessionUuidCookie:
        - "N/A"
      summary: "Download a file"
      tags:
      - "General"
  /qqq/v1/reports/{reportName}:
    get:
      description: "Run a report and stream the generated file in the requested format.\
        \  The report's input fields are given as\nquery parameters named for the\
        \ fields; a missing required input is a 400.  Requires permission to run the\
        \ report."
      parameters:
      - description: "Name of the report to run."
        example: "personReport"
        in: "path"
        name: "reportName"
        required: true
        schema:
          type: "string"
      - description: "Output format: csv, xlsx, json (as for table export)."
        example: "csv"
        in: "query"
        name: "format"
        required: true
        schema:
          type: "string"
      responses:
        200:
          content:
            application/octet-stream:
              schema:
                format: "binary"
                type: "string"
          description: "The generated report file, in the requested format"
      security:
      - sessionUuidCookie:
        - "N/A"
      summary: "Run a report and download the file"
      tags:
      - "Reports"
  /qqq/v1/bulkLoad/uploads/{uploadRef}/profile:
    get:
      description: "Read an uploaded file (by its upload ref, which must be the session\
        \ user's) and describe it for a bulk load into a table: whether row 1 is a\
        \ header row, and each column's inferred type, percent blank, distinct count,\
        \ maximum length and pattern class.  Sample values are included only for columns\
        \ mapped to an unclassified (or PUBLIC) field, or for every column when the\
        \ request's `X-QQQ-AI-Route` header is `hipaa`; unmapped columns never get\
        \ samples otherwise.  Requires the table's bulk-insert process permission.\
        \  Nothing is stored."
      parameters:
      - description: "The opaque ref of an upload the session user owns."
        in: "path"
        name: "uploadRef"
        required: true
        schema:
          type: "string"
      - description: "The table the file would be loaded into."
        example: "person"
        in: "query"
        name: "tableName"
        required: true
        schema:
          type: "string"
      - description: "Sample values per column, where allowed (0 to 20; default 5)."
        in: "query"
        name: "sampleCount"
        required: false
        schema:
          type: "integer"
      responses:
        200:
          content:
            application/json:
              examples:
                profile:
                  value:
                    fileName: "people.csv"
                    hasHeaderRow: true
                    rowsProfiled: 250
                    uploadRef: "u_4f2c"
              schema:
                $ref: "#/components/schemas/BulkLoadUploadProfileResponseV1"
          description: "The upload's header guess and column profiles"
      security:
      - sessionUuidCookie:
        - "N/A"
      summary: "Profile an uploaded file for a bulk load"
      tags:
      - "Bulk Load"
  /qqq/v1/bulkLoad/{tableName}/suggestMapping:
    post:
      description: "Run the bulk load mapping suggester over an uploaded file's header\
        \ row and return a v1 bulk load profile, the file columns it leaves unmapped,\
        \ the required fields it does not fill, and the mapped fields with a possible\
        \ value source (whose file values may need value mapping).  The upload must\
        \ be the session user's.  Requires the table's bulk-insert process permission.\
        \  Nothing is stored."
      parameters:
      - description: "The table the file would be loaded into."
        example: "person"
        in: "path"
        name: "tableName"
        required: true
        schema:
          type: "string"
      requestBody:
        content:
          application/json:
            schema:
              properties:
                uploadRef:
                  description: "The opaque ref of an upload the session user owns."
                  type: "string"
                isBulkEdit:
                  description: "Suggest a bulk edit profile (default false: bulk insert)."
                  type: "boolean"
              type: "object"
        required: false
      responses:
        200:
          content:
            application/json:
              examples:
                suggestion:
                  value:
                    profile:
                      version: "v1"
                      layout: "FLAT"
                      hasHeaderRow: true
              schema:
                $ref: "#/components/schemas/BulkLoadSuggestMappingResponseV1"
          description: "The suggested profile and what it leaves unmapped"
      security:
      - sessionUuidCookie:
        - "N/A"
      summary: "Suggest a bulk load mapping for an uploaded file"
      tags:
      - "Bulk Load"
  /qqq/v1/bulkLoad/{tableName}/validate:
    post:
      description: "Run the table's bulk-insert process over an uploaded file with\
        \ the given v1 bulk load profile - the same mapping, value mapping and validation\
        \ a real load uses - and stop at its review step, so nothing is stored.  SAMPLE\
        \ validates the first 100 rows; FULL the whole file.  Returns the standard\
        \ process summary lines, counts, and error groups with row numbers.  Values\
        \ of classified fields are left out unless the request's `X-QQQ-AI-Route`\
        \ header is `hipaa`.  The upload must be the session user's.  Requires the\
        \ table's bulk-insert process permission."
      parameters:
      - description: "The table the file would be loaded into."
        example: "person"
        in: "path"
        name: "tableName"
        required: true
        schema:
          type: "string"
      requestBody:
        content:
          application/json:
            schema:
              properties:
                uploadRef:
                  description: "The opaque ref of an upload the session user owns."
                  type: "string"
                profile:
                  description: "A v1 bulk load profile: version, layout (FLAT), hasHeaderRow,\
                    \ and fieldList entries of fieldName, columnIndex, headerName,\
                    \ defaultValue, doValueMapping, valueMappings and clearIfEmpty."
                  type: "object"
                mode:
                  description: "SAMPLE (default, the first 100 rows) or FULL."
                  enum:
                  - "SAMPLE"
                  - "FULL"
                  type: "string"
              type: "object"
        required: false
      responses:
        200:
          content:
            application/json:
              examples:
                dryRun:
                  value:
                    errorCount: 1
                    mode: "SAMPLE"
                    okCount: 2
                    processName: "person.bulkInsert"
                    recordCount: 3
              schema:
                $ref: "#/components/schemas/BulkLoadValidateResponseV1"
          description: "The dry run's summary and error groups"
      security:
      - sessionUuidCookie:
        - "N/A"
      summary: "Dry-run a bulk load profile over an uploaded file"
      tags:
      - "Bulk Load"
