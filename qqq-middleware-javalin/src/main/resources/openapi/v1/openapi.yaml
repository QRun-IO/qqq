              examples:
                TODO:
                  value:
                    associatedScripts:
                    - associatedScript:
                        fieldName: "greetingScriptId"
                        scriptTypeId: 1
                      script:
                        recordLabel: "Darin Kelkhoff - Greeting"
                        tableName: "script"
