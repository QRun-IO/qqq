components:
  schemas:
    AuthenticationMetaDataResponseV1:
      properties:
        branding:
          description: "The application's branding that is safe to show before sign-in\
            \ (names, logo, icon and accent colors; never\nbanners), so a login page\
            \ can look like the application.  Absent when the instance defines no\
            \ branding."
          properties:
            accentColor:
              description: "Primary accent color, as a CSS color value."
              type: "string"
            accentColorLight:
              description: "Light variant of the accent color, as a CSS color value."
              type: "string"
            appName:
              description: "Name of this application, for display to users."
              type: "string"
            companyName:
              description: "Name of the company that operates this application."
              type: "string"
            icon:
              description: "Path or URL of the application's small icon image."
              type: "string"
            logo:
              description: "Path or URL of the application's logo image."
              type: "string"
          type: "object"
        dashboardCspSources:
          description: "Optional public CSP source additions for standalone dashboards,\
            \ derived from configured application features; never a full policy or\
            \ inline script hashes."
          properties:
            connectSrc:
              description: "HTTP(S) connection sources required by configured features;\
                \ no default policy sources."
              items:
                type: "string"
              type: "array"
            frameSrc:
              description: "Frame sources required by configured features."
              items:
                type: "string"
              type: "array"
            scriptSrc:
              description: "Script sources required by configured features; no inline\
                \ hashes, nonces or unsafe keywords."
              items:
                type: "string"
              type: "array"
            styleSrc:
              description: "Style sources required by configured features."
              items:
                type: "string"
              type: "array"
          type: "object"
        name:
          description: "Unique name for the authentication metaData object within\
            \ the QInstance.\n"
          type: "string"
        type:
          description: "Specifier for the type of authentication module being used.\n\
            \nFrontends should use this value to determine how to prompt the user\
            \ for authentication credentials.\nIn addition, depending on this value,\
            \ additional properties will be included in this object, as\nmay be needed\
            \ to complete the authorization workflow with the provider (e.g., a baseUrl,\
            \ clientId,\nand audience for an OAuth type workflow)."
          type: "string"
        values:
          description: "Additional values, as determined by the type of authentication\
            \ provider.\n"
          oneOf:
          - description: "No additional values are used for some authentication providers."
            type: "object"
          - description: "Additional values used by the Auth0 type authentication\
              \ provider."
            properties:
              audience:
                description: "Audience for auth0"
                type: "string"
              baseUrl:
                description: "BaseUrl for auth0"
                type: "string"
              clientId:
                description: "ClientId for auth0"
                type: "string"
            type: "object"
          - description: "Additional values used by the OAuth2 type authentication\
              \ provider."
            properties:
              baseUrl:
                description: "BaseUrl for OAuth2 provider"
                type: "string"
              clientId:
                description: "ClientId for OAuth2 provider"
                type: "string"
              scopes:
                description: "OAuth2 scopes to request (space-separated)"
                type: "string"
            type: "object"
      type: "object"
    BackChannelLogoutResponseV1:
      type: "object"
    BasicErrorResponseV1:
      properties:
        error:
          description: "Description of the error"
          type: "string"
      type: "object"
    BulkLoadSuggestMappingResponseV1:
      properties:
        profile:
          description: "The suggested bulk load profile (v1: version, layout, hasHeaderRow,\
            \ isBulkEdit, and fieldList entries of fieldName, columnIndex, headerName,\
            \ defaultValue, doValueMapping, valueMappings, clearIfEmpty)."
          type: "object"
        unmappedColumns:
          description: "File columns the suggestion does not map."
          items:
            $ref: "#/components/schemas/BulkLoadColumnRef"
          type: "array"
        unmappedRequiredFields:
          description: "Required table fields the suggestion does not fill."
          items:
            $ref: "#/components/schemas/BulkLoadFieldRef"
          type: "array"
        valueMappingFields:
          description: "Mapped fields with a possible value source, whose file values\
            \ may need mapping."
          items:
            $ref: "#/components/schemas/BulkLoadFieldRef"
          type: "array"
      type: "object"
    BulkLoadUploadProfileResponseV1:
      properties:
        columns:
          description: "The columns."
          items:
            $ref: "#/components/schemas/BulkLoadColumnProfile"
          type: "array"
        fileName:
          description: "The uploaded file name."
          type: "string"
        hasHeaderRow:
          description: "Whether row 1 looks like a header row (the suggester maps\
            \ at least one of its values)."
          type: "boolean"
        rowsProfiled:
          description: "Data rows profiled (up to 1000)."
          type: "number"
        uploadRef:
          description: "The upload ref."
          type: "string"
      type: "object"
    BulkLoadValidateResponseV1:
      properties:
        errorCount:
          description: "Records with errors."
          type: "number"
        errors:
          description: "Error groups with row numbers (up to 100)."
          items:
            $ref: "#/components/schemas/BulkLoadRowError"
          type: "array"
        jobId:
          description: "Reserved: a FULL run over the durable threshold will run as\
            \ a VALIDATE job and return its id. Always null in this version."
          type: "number"
        mode:
          description: "SAMPLE (the first 100 rows) or FULL (the whole file)."
          type: "string"
        okCount:
          description: "Records that would be inserted."
          type: "number"
        previewRecordCount:
          description: "For SAMPLE, the rows validated."
          type: "number"
        processName:
          description: "The table's bulk-insert process the dry run used."
          type: "string"
        recordCount:
          description: "Records read from the file."
          type: "number"
        summaryLines:
          description: "The standard process summary lines."
          items:
            $ref: "#/components/schemas/BulkLoadSummaryLine"
          type: "array"
      type: "object"
    FormAdjusterOutputV1:
      description: "Changes a form adjuster asks the form to apply.  Absent or null\
        \ properties mean no change."
      properties:
        updatedFieldMetaData:
          additionalProperties:
            $ref: "#/components/schemas/FieldMetaData"
          description: "Replacement definitions for fields, by field name."
          type: "object"
        updatedFieldValues:
          additionalProperties: true
          description: "New values for fields, by field name."
          type: "object"
        updatedFieldDisplayValues:
          additionalProperties:
            type: "string"
          description: "Display values for possible-value fields whose values changed,\
            \ by field name."
          type: "object"
        fieldsToClear:
          description: "Fields whose values should be cleared."
          items:
            type: "string"
          type: "array"
        updatedSectionMetaData:
          additionalProperties:
            $ref: "#/components/schemas/TableSection"
          description: "Replacement definitions for form sections, by section name."
          type: "object"
        isFormDisabled:
          description: "Whether the form should be disabled."
          type: "boolean"
        formDisabledMessage:
          description: "Why the form is disabled."
          type: "string"
      type: "object"
    HelpCoverageResponseV1:
      properties:
        entries:
          items:
            $ref: "#/components/schemas/HelpCoverageEntryV1"
          type: "array"
        totals:
          items:
            $ref: "#/components/schemas/HelpCoverageTotalV1"
          type: "array"
      type: "object"
    HelpSearchResponseV1:
      properties:
        results:
          items:
            $ref: "#/components/schemas/HelpSearchResultV1"
          type: "array"
      type: "object"
    LogoutResponseV1:
      type: "object"
    ManageSessionResponseV1:
      properties:
        uuid:
          description: "Unique identifier of the session. Required to be returned\
            \ on subsequent requests in the sessionUUID Cookie, to prove authentication.\
            \ Not included when the cookie is HttpOnly or the session was resumed\
            \ from that cookie."
          type: "string"
        values:
          additionalProperties: true
          description: "Optional object with application-defined values."
          type: "object"
      type: "object"
    MetaDataResponseV1:
      properties:
        appTree:
          description: "Tree of apps within the QQQ Instance, sorted and organized\
            \ hierarchically, for presentation to a user."
          items:
            $ref: "#/components/schemas/AppTreeNode"
          type: "array"
        apps:
          additionalProperties:
            $ref: "#/components/schemas/AppMetaData"
          description: "Map of all apps within the QQQ Instance (that the user has\
            \ permission to see that they exist)."
          type: "object"
        branding:
          description: "Application identity (names, logo, icon, accent colors and\
            \ banners), when the instance defines it."
          properties:
            accentColor:
              description: "Primary accent color, as a CSS color value."
              type: "string"
            accentColorLight:
              description: "Light variant of the accent color, as a CSS color value."
              type: "string"
            appName:
              description: "Name of this application, for display to users."
              type: "string"
            banners:
              additionalProperties:
                $ref: "#/components/schemas/BrandingBanner"
              description: "Banners to display, keyed by the slot where each is shown."
              type: "object"
            companyName:
              description: "Name of the company that operates this application."
              type: "string"
            companyUrl:
              description: "URL for the company's web site."
              type: "string"
            icon:
              description: "Path or URL of the application's small icon image."
              type: "string"
            logo:
              description: "Path or URL of the application's logo image."
              type: "string"
          type: "object"
        environmentValues:
          additionalProperties:
            type: "string"
          description: "Environment values a frontend may use: Google Picker public\
            \ browser settings GOOGLE_APP_CLIENT_ID and GOOGLE_APP_API_KEY, and the\
            \ analytics settings (ANALYTICS_PROVIDERS, ANALYTICS_PLUGIN_SCRIPTS, ANALYTICS_PLUGIN_SCRIPT_URLS,\
            \ GOOGLE_ANALYTICS_ENABLED, GOOGLE_ANALYTICS_TRACKING_ID, POSTHOG_ENABLED,\
            \ POSTHOG_API_KEY, POSTHOG_PROJECT_API_KEY, POSTHOG_HOST, and any other\
            \ ANALYTICS_* value), from the instance's QQQ_ENV_* environment.  An explicit\
            \ allow-list - never the whole environment.  Omitted when none are set."
          type: "object"
        helpContents:
          additionalProperties:
            items:
              $ref: "#/components/schemas/HelpContentV1"
            type: "array"
          description: "Instance-level help content, by slot name (for example the\
            \ query screen's bulkAddFilterValues and bulkAddFilterValuesPossibleValueSource\
            \ slots).  Omitted when the instance defines none."
          type: "object"
        homeAppName:
          description: "Name of the app whose dashboard a frontend shows as the instance's\
            \ home page (for example at /app/), when the instance designates one and\
            \ the user may access that app.  Omitted otherwise, in which case the\
            \ frontend uses its own default home page."
          type: "string"
        metaDataGeneration:
          type: "number"
        processes:
          additionalProperties:
            $ref: "#/components/schemas/ProcessMetaDataLight"
          description: "Map of all processes within the QQQ Instance (that the user\
            \ has permission to see that they exist)."
          type: "object"
        reports:
          additionalProperties:
            properties:
              hasPermission:
                description: "Whether the user may run the report."
                type: "object"
              helpContents:
                additionalProperties:
                  items:
                    $ref: "#/components/schemas/HelpContentV1"
                  type: "array"
                description: "Help entries by slot, filtered for the current session."
                type: "object"
              iconName:
                description: "Name of the report's icon."
                type: "string"
              label:
                description: "User-facing name for this report."
                type: "string"
              name:
                description: "Unique name for this report within the QQQ Instance."
                type: "string"
              processName:
                description: "Process that runs this report, when it has one; otherwise\
                  \ it runs from GET /reports/{reportName}."
                type: "string"
            type: "object"
          description: "Map of all reports within the QQQ Instance (that the user\
            \ has permission to see that they exist)."
          type: "object"
        supplementalInstanceMetaData:
          description: "Settings from supplemental modules that a frontend may use\
            \ (an explicit allow-list - not the supplemental meta-data objects themselves).\
            \  Omitted when the instance defines none of them."
          properties:
            assistant:
              additionalProperties: true
              description: "Present (an object) when the instance has the assistant\
                \ QBit's `assistant` supplemental meta-data - that is, when the assistant\
                \ is installed and enabled, so a frontend may probe its routes.  Always\
                \ has `available: true`, plus the strings, numbers and booleans the\
                \ QBit publishes for frontends."
              type: "object"
            materialDashboard:
              description: "Settings from the instance's `materialDashboard` supplemental\
                \ meta-data, when the instance defines it."
              properties:
                processNamesToAddToAllQueryAndViewScreens:
                  description: "Names of processes to offer on the query and record-view\
                    \ screens of every table, in their configured order.  Only processes\
                    \ that the user may see (i.e., that are in the meta-data's `processes`\
                    \ map) are listed, so the list may be empty."
                  items:
                    type: "string"
                  type: "array"
                recordViewActionsPlacement:
                  description: "Where the record view puts its actions: IN_IDENTITY_SECTION\
                    \ or INLINE_WITH_PAGE_TITLE.  When set, this overrides each table's\
                    \ placement."
                  type: "string"
                weekdayCriteriaSettings:
                  description: "Weekday criteria settings for the query screens (day\
                    \ is any of, day is none of).  Omitted when the material dashboard\
                    \ meta-data does not define them."
                  properties:
                    dateTimeFieldFunctionArguments:
                      additionalProperties: true
                      description: "Arguments for the WeekdayOfDateTime field function\
                        \ that a frontend sends with weekday criteria on date-time\
                        \ fields (for example timeZoneId or useSessionZoneId)."
                      type: "object"
                    enabled:
                      description: "Whether query screens offer the weekday criteria\
                        \ (day is any of, day is none of) on date and date-time fields."
                      type: "boolean"
                  type: "object"
              type: "object"
            materialDashboardTheme:
              additionalProperties: true
              description: "The application theme from the instance's MaterialDashboardThemeMetaData\
                \ supplemental meta-data, when the instance defines it.  Keys are\
                \ MaterialDashboardThemeMetaData property names (for example primaryColor,\
                \ fontFamily, typographyH1FontSize, borderRadiusGlobal, density, customCss,\
                \ brandedHeaderEnabled, sidebarBackgroundColor, tableHeaderBackgroundColor);\
                \ values are strings, numbers or booleans.  An explicit allow-list\
                \ of the theme's visual properties; properties without a value are\
                \ omitted."
              type: "object"
          type: "object"
        tables:
          additionalProperties:
            $ref: "#/components/schemas/TableMetaDataLight"
          description: "Map of all tables within the QQQ Instance (that the user has\
            \ permission to see that they exist)."
          type: "object"
        widgets:
          additionalProperties:
            properties:
              defaultValues:
                additionalProperties: true
                description: "Frontend widget defaults, including explicit association\
                  \ bindings"
                type: "object"
              dropdowns:
                description: "Dropdowns the widget offers to filter its data."
                type: "array"
              footerHTML:
                description: "HTML shown below the widget."
                type: "string"
              gridColumns:
                description: "Number of grid columns (of 12) the widget spans."
                type: "number"
              hasPermission:
                description: "Whether the user may render the widget."
                type: "object"
              helpContent:
                additionalProperties:
                  items:
                    $ref: "#/components/schemas/HelpContentV1"
                  type: "array"
                description: "Help content by slot."
                type: "object"
              icon:
                description: "Name of the widget's icon."
                type: "string"
              icons:
                additionalProperties: true
                description: "Icons by role (for example the widget header icon)."
                type: "object"
              isCard:
                description: "Whether the widget is drawn as a card."
                type: "object"
              label:
                description: "User-facing name for this widget"
                type: "string"
              minHeight:
                description: "Minimum height of the widget (a CSS length)."
                type: "string"
              name:
                description: "Unique name for this widget within the QQQ Instance"
                type: "string"
              showExportButton:
                description: "Whether the widget offers an export button."
                type: "object"
              showReloadButton:
                description: "Whether the widget offers a reload button."
                type: "object"
              storeDropdownSelections:
                description: "Whether dropdown selections are remembered for the user."
                type: "object"
              tooltip:
                description: "Tooltip text for the widget."
                type: "string"
              type:
                description: "The type of this widget."
                type: "string"
            type: "object"
          description: "Map of all widgets within the QQQ Instance (that the user\
            \ has permission to see that they exist)."
          type: "object"
      type: "object"
    PossibleValueOption:
      properties:
        displayValues:
          description: "For a picker request: formatted or translated display values,\
            \ where they differ from the raw values"
          type: "object"
        id:
          description: "Unique identifier for this possible value option"
          type: "object"
        label:
          description: "Human-readable label for this possible value option"
          type: "string"
        values:
          description: "For a picker request: the option's picker display values (thumbnail,\
            \ preview, subtitle and detail fields), raw"
          type: "object"
      type: "object"
    PossibleValuesResponseV1:
      properties:
        hasMore:
          description: "For a picker request: whether another page of options follows\
            \ (the picker never counts)"
          type: "boolean"
        options:
          description: "List of possible value options matching the search request"
          items:
            $ref: "#/components/schemas/PossibleValueOption"
          type: "array"
      type: "object"
    PreferenceActionRequestV1:
      additionalProperties: false
      description: "Only rowKey and values are accepted. Identity always comes from\
        \ the authenticated session."
      properties:
        rowKey:
          description: "Required for ROW actions: a key loaded for this user with\
            \ the action allowed. Forbidden for SECTION and LIST actions."
          type: "string"
        values:
          additionalProperties: {}
          description: "Action input fields. Validated and coerced like PATCH fields;\
            \ unknown fields are rejected."
          type: "object"
      type: "object"
    PreferenceActionResponseV1:
      description: "Action result and reloaded section. Secrets are shown once and\
        \ must not be stored by clients. Response uses Cache-Control: no-store."
      properties:
        section:
          $ref: "#/components/schemas/PreferenceSectionV1"
        message:
          description: "User-facing outcome message."
          type: "string"
        secrets:
          description: "One-time secrets for immediate display; clients must not store\
            \ them."
          items:
            $ref: "#/components/schemas/PreferenceSecretV1"
          type: "array"
        focusRowKey:
          description: "Optional row key to focus after reloading the section."
          type: "string"
      type: "object"
    PreferenceActionV1:
      properties:
        name:
          description: "Stable action name used in URLs."
          type: "string"
        label:
          description: "Human-readable action label."
          type: "string"
        icon:
          $ref: "#/components/schemas/Icon"
        description:
          description: "Explanation for clients to display."
          type: "string"
        scope:
          description: "Where to display this action. ROW actions require a loaded\
            \ row key."
          enum:
          - "SECTION"
          - "LIST"
          - "ROW"
          type: "string"
        listName:
          description: "List targeted by LIST or ROW actions; null for SECTION."
          nullable: true
          type: "string"
        confirmationText:
          description: "When set, clients must confirm with this text before running\
            \ the action."
          nullable: true
          type: "string"
        isDestructive:
          description: "Whether clients should present this as a destructive action."
          type: "boolean"
        inputFields:
          description: "Action inputs, using preference field validation and coercion."
          items:
            $ref: "#/components/schemas/FieldMetaData"
          type: "array"
        order:
          description: "Display order, ascending then label; defaults to 100."
          type: "integer"
      type: "object"
    PreferenceListV1:
      description: "A list of fixed preference rows, rendered with the same typed\
        \ field editors as scalar preferences."
      properties:
        name:
          description: "List name used in PATCH lists."
          type: "string"
        label:
          description: "Human-readable list title."
          type: "string"
        description:
          description: "Explanation of this list."
          type: "string"
        rowLabel:
          description: "Label for one row, such as Category."
          type: "string"
        fields:
          description: "Editable columns and their validation rules."
          items:
            $ref: "#/components/schemas/FieldMetaData"
          type: "array"
        rows:
          description: "Fixed rows available to this user."
          items:
            $ref: "#/components/schemas/PreferenceRowV1"
          type: "array"
      type: "object"
    PreferenceRowV1:
      description: "A provider-owned row. Clients change row membership only through\
        \ registered actions."
      properties:
        actionNames:
          description: "Null allows every ROW action of this list; empty allows none;\
            \ otherwise only the named actions are allowed."
          items:
            type: "string"
          nullable: true
          type: "array"
        key:
          description: "Stable provider row key to send when patching."
          type: "string"
        label:
          description: "Human-readable row label."
          type: "string"
        description:
          description: "Explanation of this row."
          type: "string"
        values:
          additionalProperties: {}
          description: "Field name to typed value. Omitted fields retain their existing\
            \ values; explicit null clears an optional field."
          type: "object"
        readOnlyFields:
          description: "Field names that cannot be changed for this row."
          items:
            type: "string"
          type: "array"
        readOnlyReason:
          description: "Explain why the indicated fields are read-only."
          type: "string"
      type: "object"
    PreferenceSecretV1:
      properties:
        label:
          description: "Human-readable secret label."
          type: "string"
        value:
          description: "Shown once. Clients must not store, log, cache, or send this\
            \ secret to analytics."
          type: "string"
        masked:
          description: "Masked representation, for example qqq_…7f3a."
          type: "string"
        usageText:
          description: "Usage guidance such as a curl example; may contain newlines."
          type: "string"
      type: "object"
    PreferenceSectionPatchRequestV1:
      additionalProperties: false
      description: "Partial update for the signed-in user only. Unknown properties,\
        \ fields, lists and rows, including userId, are rejected with 400. All validation\
        \ errors are returned together; omitted fields and rows are unchanged."
      properties:
        values:
          additionalProperties: {}
          description: "Changed scalar fields only. Explicit null clears an optional\
            \ field. Types, required, maxLength, ENUM membership and editability are\
            \ validated."
          type: "object"
        lists:
          additionalProperties:
            items:
              additionalProperties: false
              properties:
                key:
                  description: "Required fixed row key from the section response.\
                    \ No new rows can be created."
                  type: "string"
                values:
                  additionalProperties: {}
                  description: "Changed row fields only. Read-only fields are rejected."
                  type: "object"
              type: "object"
            type: "array"
          description: "List name to changed fixed rows. No add or remove operation\
            \ is supported."
          type: "object"
      type: "object"
    PreferenceSectionV1:
      description: "One visible section with the signed-in user's current preferences."
      properties:
        showInUserMenu:
          description: "Add a user-menu entry using the section label and icon to\
            \ open this section; defaults to false."
          type: "boolean"
        name:
          description: "Stable section name used in URLs."
          type: "string"
        label:
          description: "Human-readable section title."
          type: "string"
        description:
          description: "Explanation for clients to display."
          type: "string"
        appName:
          description: "Optional owning application name."
          type: "string"
        icon:
          $ref: "#/components/schemas/Icon"
        order:
          description: "Display order, ascending then label; defaults to 100."
          type: "integer"
        fields:
          description: "Scalar field definitions with editability, type, defaults\
            \ and validation."
          items:
            $ref: "#/components/schemas/FieldMetaData"
          type: "array"
        values:
          additionalProperties: {}
          description: "Field name to typed value. Omitted fields retain their existing\
            \ values; explicit null clears an optional field."
          type: "object"
        actions:
          description: "Registered section, list and row actions, ordered by order\
            \ then label."
          items:
            $ref: "#/components/schemas/PreferenceActionV1"
          type: "array"
        lists:
          description: "Optional fixed-row preference lists."
          items:
            $ref: "#/components/schemas/PreferenceListV1"
          type: "array"
        possibleValues:
          additionalProperties:
            items:
              $ref: "#/components/schemas/PossibleValueOption"
            type: "array"
          description: "Every ENUM possible-value source referenced by scalar, list\
            \ or action input fields, keyed by source name."
          type: "object"
      type: "object"
    PreferencesResponseV1:
      description: "Visible sections in display order, with only the signed-in user's\
        \ values."
      properties:
        sections:
          description: "Installed sections the session may access; an empty list is\
            \ valid."
          items:
            $ref: "#/components/schemas/PreferenceSectionV1"
          type: "array"
      type: "object"
    ProcessCancelResponseV1:
      type: "object"
    ProcessJobLaunchResponseV1:
      properties:
        jobId:
          description: "Id of the new durable job (a jobs_job record; read it with\
            \ GET /table/jobs_job/{jobId})."
          type: "number"
        status:
