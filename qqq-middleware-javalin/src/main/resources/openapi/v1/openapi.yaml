                type: "boolean"
              placeholder:
                description: "Optional placeholder text to display in the input box."
                type: "string"
              submitOnEnter:
                description: "Indicate whether the form that this field is on should\
                  \ be submitted when Enter is pressed"
                type: "boolean"
            type: "object"
          - description: "Values used for a TEXT type widget block"
            properties:
              endIcon:
                description: "An optional icon to display after the text"
                properties:
                  color:
                    description: "A color code to use for displaying the icon"
                    type: "string"
                  name:
                    description: "A material UI icon name."
                    type: "string"
                  path:
                    description: "A path to an image file that can be requested from\
                      \ the server, to serve as the icon image instead of a material\
                      \ UI icon."
                    type: "string"
                type: "object"
              startIcon:
                description: "An optional icon to display before the text"
                properties:
                  color:
                    description: "A color code to use for displaying the icon"
                    type: "string"
                  name:
                    description: "A material UI icon name."
                    type: "string"
                  path:
                    description: "A path to an image file that can be requested from\
                      \ the server, to serve as the icon image instead of a material\
                      \ UI icon."
                    type: "string"
                type: "object"
              text:
                description: "The text to display in the block"
                type: "string"
            type: "object"
      type: "object"
    WidgetBlockAudioValues:
      description: "Values used for an AUDIO type widget block"
      properties:
        autoPlay:
          description: "Control if the file should automatically play when the block\
            \ is rendered"
          type: "boolean"
        path:
          description: "The path to the audio file on the server"
          type: "string"
        showControls:
          description: "Control if on-screen controls should be shown to allow the\
            \ user to control playback"
          type: "boolean"
      type: "object"
    WidgetBlockBaseStyles:
      properties:
        backgroundColor:
          description: "A background color to use for the block"
          type: "string"
        padding:
          description: "Optional padding to apply to the block"
          properties:
            bottom:
              type: "object"
            left:
              type: "object"
            right:
              type: "object"
            top:
              type: "object"
          type: "object"
      type: "object"
    WidgetBlockButtonStyles:
      properties:
        color:
          description: "A Color to use for the button.  May be specified as a StandardColor\
            \ (one of: SUCCESS, WARNING, ERROR, INFO, MUTED) or an RGB code."
          type: "string"
        format:
          description: "An optional indicator of the screen format preferred by the\
            \ application to be used for this block, such as OUTLINED, FILLED, or\
            \ TEXT.  Different frontends may support different formats, and implement\
            \ them differently."
          type: "string"
      type: "object"
    WidgetBlockButtonValues:
      description: "Values used for a BUTTON type widget block"
      properties:
        actionCode:
          description: "Code used within the app as the value submitted when the button\
            \ is clicked"
          type: "string"
        controlCode:
          description: "Instructions for what should happen in the frontend (e.g.,\
            \ within a screen), when the button is clicked.\n\nTo show a modal composite\
            \ block, use format:  `showModal:${blockId}` (e.g., `showModal:myBlock`)\n\
            \nTo hide a modal composite block, use format:  `hideModal:${blockId}`\
            \ (e.g., `hideModal:myBlock`)\n\nTo toggle visibility of a modal composite\
            \ block, use format:  `toggleModal:${blockId}` (e.g., `toggleModal:myBlock`)\n"
          type: "string"
        endIcon:
          $ref: "#/components/schemas/Icon"
          description: "An optional icon to display after the text in the button"
        label:
          description: "User-facing label to display in the button"
          type: "string"
        startIcon:
          $ref: "#/components/schemas/Icon"
          description: "An optional icon to display before the text in the button"
      type: "object"
    WidgetBlockImageStyles:
      properties:
        height:
          description: "A request to render the image at a specified height."
          type: "string"
        padding:
          description: "Optional padding to apply to the image"
          properties:
            bottom:
              type: "object"
            left:
              type: "object"
            right:
              type: "object"
            top:
              type: "object"
          type: "object"
        width:
          description: "A request to render the image at a specified width."
          type: "string"
      type: "object"
    WidgetBlockImageValues:
      description: "Values used for an IMAGE type widget block"
      properties:
        path:
          description: "The path to the image on the server"
          type: "string"
      type: "object"
    WidgetBlockInputFieldValues:
      description: "Values used for an INPUT_FIELD type widget block"
      properties:
        autoFocus:
          description: "Indicate whether this field should auto-focus when it is rendered"
          type: "boolean"
        fieldMetaData:
          $ref: "#/components/schemas/FieldMetaData"
          description: "Metadata to define the field that this block controls"
        hideSoftKeyboard:
          description: "Indicate if the frontend uses a software/on-screen keyboard,\
            \ if the application should try to hide it (e.g., upon auto-focus)."
          type: "boolean"
        placeholder:
          description: "Optional placeholder text to display in the input box."
          type: "string"
        submitOnEnter:
          description: "Indicate whether the form that this field is on should be\
            \ submitted when Enter is pressed"
          type: "boolean"
      type: "object"
    WidgetBlockStyles:
      type: "object"
    WidgetBlockTextStyles:
      properties:
        color:
          description: "A Color to display the text in.  May be specified as a StandardColor\
            \ (one of: SUCCESS, WARNING, ERROR, INFO, MUTED) or an RGB code."
          type: "string"
        format:
          description: "An optional indicator of the screen format preferred by the\
            \ application to be used for this block.  Different frontends may support\
            \ different formats, and implement them differently."
          type: "string"
        size:
          description: "An optional indicator of the size at which the text should\
            \ be rendered.  May be a named value (one oflargest, headline, title,\
            \ body, smallest) or a numeric size - both are up to the frontend to interpret."
          type: "string"
        weight:
          description: "An optional indicator of the weight at which the text should\
            \ be rendered.  May be a named value (one ofextralight, thin, medium,\
            \ black, semibold, bold, extrabold) or a numeric, e.g., 100, 200, ...,\
            \ 900"
          type: "string"
      type: "object"
    WidgetBlockTextValues:
      description: "Values used for a TEXT type widget block"
      properties:
        endIcon:
          $ref: "#/components/schemas/Icon"
          description: "An optional icon to display after the text"
        startIcon:
          $ref: "#/components/schemas/Icon"
          description: "An optional icon to display before the text"
        text:
          description: "The text to display in the block"
          type: "string"
      type: "object"
    WidgetBlockValues:
      type: "object"
    WidgetResponseV1:
      properties:
        widgetData:
          description: "Widget data object, whose shape varies by widget type."
          type: "object"
      type: "object"
  securitySchemes:
    sessionUuidCookie:
      in: "cookie"
      name: "sessionUUID"
      type: "apiKey"
info:
  contact:
    email: "contact@kingsrook.com"
  description: "## Intro\nThis is the definition of the standard API implemented by\
    \ QQQ Middleware.\n\nDevelopers of QQQ Frontends (e.g., javascript libraries,\
    \ or native applications) use this API to access\na QQQ Backend server.\n\nAs\
    \ such, this API itself is not concerned with any of the application-level details\
    \ of any particular\napplication built using QQQ.  Instead, this API is all about\
    \ the generic endpoints used for any application\nbuilt on QQQ.  For example,\
    \ many endpoints work with a `${table}` path parameter - whose possible values\n\
    are defined by the application - but which are not known to this API.\n\n## Flow\n\
    The typical flow of a user (as implemented in a frontend that utilizes this API)\
    \ looks like:\n1. Frontend calls `.../metaData/authentication`, to know what type\
    \ of authentication provider is used by the backend, and display an appropriate\
    \ UI to the user for authenticating.\n2. User authenticates in frontend, as required\
    \ for the authentication provider.\n3. Frontend calls `.../manageSession`, providing\
    \ authentication details (e.g., an accessToken or other credentials) to the backend.\n\
    4. The response from the `manageSession` call (assuming success), sets the `sessionUUID`\
    \ Cookie, which should be included in all subsequent requests for authentication.\n\
    5. After the user is authenticated, the frontend calls `.../metaData`, to discover\
    \ the apps, tables, processes, etc, that the application is made up of (and that\
    \ the authenticated user has permission to access).\n6. As the user interacts\
    \ with apps, tables, process, etc, the frontend utilizes the appropriate endpoints\
    \ as required.\n"
  title: "QQQ Middleware API"
  version: "v1"
openapi: "3.0.3"
paths:
  /qqq/v1/metaData/authentication:
    get:
      description: "For a frontend to determine which authentication provider or mechanism\
        \ to use, it should begin its lifecycle\nby requesting this metaData object,\
        \ and inspecting the `type` property in the response.\n\nNote that this endpoint\
        \ is not secured, as its purpose is to be called as part of the workflow that\
        \ results\nin a user being authenticated."
      responses:
        200:
          content:
            application/json:
              examples:
                For FULLY_ANONYMOUS type:
                  value:
                    name: "anonymous"
                    type: "FULLY_ANONYMOUS"
                For AUTH_0 type:
                  value:
                    name: "auth0"
                    type: "AUTH_0"
                    values:
                      audience: "myapp.mydomain.com"
                      baseUrl: "https://myapp.auth0.com/"
                      clientId: "abcdefg1234567"
              schema:
                $ref: "#/components/schemas/AuthenticationMetaDataResponseV1"
          description: "Successful Response"
      summary: "Get authentication metaData"
      tags:
      - "Authentication"
  /qqq/v1/manageSession:
    post:
      description: "After a frontend authenticates the user as per the requirements\
        \ of the authentication provider specified by the\n`type` field in the `metaData/authentication`\
        \ response, data from that authentication provider should be posted\nto this\
        \ endpoint, to create a session within the QQQ application.\n\nThe response\
        \ object will include a session identifier (`uuid`) to authenticate the user\
        \ in subsequent API calls.\n\nFor the `TABLE_BASED` type, send the user's\
        \ credentials in an `Authorization: Basic` header (base64 of\n`username:password`,\
        \ UTF-8); the body may be empty.  The password is verified against the user\
        \ table and a\nsession row is stored; a `401` response means the credentials\
        \ were refused."
      parameters:
      - description: "For `TABLE_BASED` authentication: `Basic ` followed by the base64\
          \ encoding of `username:password` (UTF-8).\nNot used by other authentication\
          \ types."
        example: "Basic dXNlcm5hbWU6cGFzc3dvcmQ="
        in: "header"
        name: "Authorization"
        schema:
          type: "string"
      requestBody:
        content:
          application/json:
            schema:
              description: "Data required to create the session.  Specific needs may\
                \ vary based on the AuthenticationModule type in the QQQ Backend."
              properties:
                accessToken:
                  description: "An access token from a downstream authentication provider\
                    \ (e.g., Auth0), to use as the basis for authentication and authorization."
                  type: "string"
                code:
                  description: "OAuth2 authorization code, for the backend to exchange\
                    \ with the identity provider (authorization-code + PKCE sign-in)."
                  type: "string"
                codeVerifier:
                  description: "PKCE code verifier that goes with `code`."
                  type: "string"
                redirectUri:
                  description: "Redirect URI the authorization `code` was issued to."
                  type: "string"
                sessionUUID:
                  description: "UUID of an existing session (from its sessionUUID\
                    \ cookie), to resume it instead of signing in again."
                  type: "string"
              type: "object"
        required: true
      responses:
        401:
          content:
            application/json:
              examples:
                Invalid token:
                  value:
                    error: "Unable to decode access token."
              schema:
                $ref: "#/components/schemas/BasicErrorResponseV1"
          description: "Authentication error - session was not created"
        200:
          content:
            application/json:
              examples:
                With no custom values:
                  value:
                    uuid: "01234567-89AB-CDEF-0123-456789ABCDEF"
                With custom values:
                  value:
                    uuid: "98765432-10FE-DCBA-9876-543210FEDCBA"
                    values:
                      region: "US"
                      userCategoryId: 47
              schema:
                $ref: "#/components/schemas/ManageSessionResponseV1"
          description: "Successful response - session has been created"
      summary: "Create a session"
      tags:
      - "Authentication"
  /qqq/v1/logout:
    post:
      description: "Invalidates the current session server-side, deleting it from\
        \ the session store\nand clearing any cached data. The session cookie is also\
        \ removed.\n\nFrontends should call this endpoint before performing client-side\
        \ logout\n(clearing localStorage, redirecting to IdP logout, etc.) to ensure\
        \ the\nsession cannot be resumed."
      responses:
        200:
          content:
            application/json:
              examples:
                Successful logout: {}
              schema:
                $ref: "#/components/schemas/LogoutResponseV1"
          description: "Session has been invalidated"
      summary: "Logout and invalidate session"
      tags:
      - "Authentication"
  /qqq/v1/oidc/backchannel-logout:
    post:
      description: "Receives logout notifications from the Identity Provider (IdP)\
        \ when a user\nlogs out from the IdP or another application in the SSO ecosystem.\n\
        \nThe IdP sends a POST request with a 'logout_token' JWT parameter containing\n\
        either a 'sub' (subject) or 'sid' (session ID) claim. QQQ finds and deletes\n\
        all matching sessions.\n\nThis endpoint should be registered with your IdP\
        \ as the back-channel logout URI."
      responses:
        200:
          content:
            application/json:
              examples:
                Successful logout: {}
              schema:
                $ref: "#/components/schemas/BackChannelLogoutResponseV1"
          description: "Back-channel logout processed successfully"
      summary: "OIDC Back-Channel Logout"
      tags:
      - "Authentication"
  /qqq/v1/metaData:
    get:
      description: "Load the overall metadata, as is relevant to a frontend, for the\
        \ entire application, with permissions applied, as per the\nauthenticated\
        \ user.\n\nThis includes:\n- Apps (both as a map of name to AppMetaData (`apps`),\
        \ but also as a tree (`appTree`), for presenting\nhierarchical navigation),\n\
        - Tables (but without all details, e.g., fields),\n- Processes (also without\
        \ full details, e.g., screens),\n- Reports\n- Widgets\n- Branding\n- Help\
        \ Contents\n- Environment values\n"
      parameters:
      - description: "Name of the frontend requesting the meta-data.\nGenerally a\
          \ QQQ frontend library, unless a custom application frontend has been built."
        example: "qqq-frontend-material-dashboard"
        in: "query"
        name: "frontendName"
        schema:
          type: "string"
      - description: "Version of the frontend requesting the meta-data."
        example: "0.23.0"
        in: "query"
        name: "frontendVersion"
        schema:
          type: "string"
      - description: "Name of the application requesting the meta-data.  e.g., an\
          \ instance of a specific frontend\n(i.e., an application might be deployed\
          \ with 2 different qqq-frontend-material-dashboard frontends,\nin which\
          \ case this attribute allows differentiation between them)."
        example: "my-admin-web-app"
        in: "query"
        name: "applicationName"
        schema:
          type: "string"
      - description: "Version of the application requesting the meta-data."
        example: "20241021"
        in: "query"
        name: "applicationVersion"
        schema:
          type: "string"
      responses:
        200:
          content:
            application/json:
              examples:
                Example:
                  value:
                    appTree:
                    - children:
                      - children:
                        - icon:
                            name: "person_add"
                          label: "Sample Person Process"
                          name: "samplePersonProcess"
                          type: "PROCESS"
                        icon:
                          name: "child_friendly"
                        label: "Child App"
                        name: "childApp"
                        type: "APP"
                      - icon:
                          name: "person_outline"
                        label: "Person"
                        name: "person"
                        type: "TABLE"
                      icon:
                        name: "home"
                      label: "Home App"
                      name: "homeApp"
                      type: "APP"
                    apps:
                      homeApp:
                        childMap:
                          person:
                            icon:
                              name: "person_outline"
                            label: "Person"
                            name: "person"
                            type: "TABLE"
                          childApp:
                            icon:
                              name: "child_friendly"
                            label: "Child App"
                            name: "childApp"
                            type: "APP"
                        children:
                        - icon:
                            name: "child_friendly"
                          label: "Child App"
                          name: "childApp"
                          type: "APP"
                        - icon:
                            name: "person_outline"
                          label: "Person"
                          name: "person"
                          type: "TABLE"
                        icon:
                          name: "home"
                        label: "Home App"
                        name: "homeApp"
                        sections:
                        - icon:
                            name: "badge"
                          label: "Home App"
                          name: "homeApp"
                          tables:
                          - "person"
                      childApp:
                        childMap:
                          samplePersonProcess:
                            icon:
                              name: "person_add"
                            label: "Sample Person Process"
                            name: "samplePersonProcess"
                            type: "PROCESS"
                        children:
                        - icon:
                            name: "person_add"
                          label: "Sample Person Process"
                          name: "samplePersonProcess"
                          type: "PROCESS"
                        icon:
                          name: "child_friendly"
                        label: "Child App"
                        name: "childApp"
                        sections:
                        - icon:
                            name: "badge"
                          label: "Child App"
                          name: "childApp"
                          processes:
                          - "samplePersonProcess"
                    processes:
                      person.bulkInsert:
                        hasPermission: true
                        icon:
                          name: "library_add"
                        iconName: "library_add"
                        isHidden: true
                        label: "Person Bulk Insert"
                        name: "person.bulkInsert"
                        stepFlow: "LINEAR"
                        tableName: "person"
                      person.bulkEdit:
                        hasPermission: true
                        isHidden: true
                        label: "Person Bulk Edit"
                        name: "person.bulkEdit"
                        stepFlow: "LINEAR"
                        tableName: "person"
                      samplePersonProcess:
                        hasPermission: true
                        icon:
                          name: "person_add"
                        iconName: "person_add"
                        isHidden: false
                        label: "Sample Person Process"
                        name: "samplePersonProcess"
                        stepFlow: "LINEAR"
                        tableName: "person"
                      person.bulkDelete:
                        hasPermission: true
                        isHidden: true
                        label: "Person Bulk Delete"
                        name: "person.bulkDelete"
                        stepFlow: "LINEAR"
                        tableName: "person"
                      person.bulkEditWithFile:
                        hasPermission: true
                        isHidden: true
                        label: "Person Bulk Edit With File"
                        name: "person.bulkEditWithFile"
                        stepFlow: "LINEAR"
                        tableName: "person"
                    tables:
                      person:
                        capabilities:
                        - "TABLE_COUNT"
                        - "TABLE_GET"
                        - "TABLE_QUERY"
                        - "QUERY_STATS"
                        - "TABLE_INSERT"
                        - "TABLE_UPDATE"
                        - "TABLE_DELETE"
                        - "TABLE_EXPORT"
                        deletePermission: true
                        editPermission: true
                        icon:
                          name: "person_outline"
                        insertPermission: true
                        isHidden: false
                        label: "Person"
                        name: "person"
                        readPermission: true
              schema:
                $ref: "#/components/schemas/MetaDataResponseV1"
          description: "Overall metadata for the application."
      security:
      - sessionUuidCookie:
        - "N/A"
      summary: "Get instance metaData"
      tags:
      - "General"
  /qqq/v1/metaData/table/{tableName}:
    get:
      description: "Load the full metadata for a single table, including all fields,\
        \ which a frontend\nneeds to display to users."
      parameters:
      - description: "Name of the table to load."
        example: "person"
        in: "path"
        name: "tableName"
        required: true
        schema:
          type: "string"
      responses:
        200:
          content:
            application/json:
              examples:
                Example:
                  value:
                    tableMetaData:
                      capabilities:
                      - "TABLE_COUNT"
                      - "TABLE_GET"
                      - "TABLE_QUERY"
                      - "QUERY_STATS"
                      - "TABLE_INSERT"
                      - "TABLE_UPDATE"
                      - "TABLE_DELETE"
                      - "TABLE_EXPORT"
                      deletePermission: true
                      editPermission: true
                      fields:
                        id:
                          displayFormat: "%s"
                          isEditable: true
                          isHeavy: false
                          isHidden: false
                          isRequired: false
                          label: "Id"
                          name: "id"
                          type: "INTEGER"
                      icon:
                        name: "person_outline"
                      insertPermission: true
                      isHidden: false
                      label: "Person"
                      name: "person"
                      primaryKeyField: "id"
                      readPermission: true
                      sections:
                      - fieldNames:
                        - "id"
                        hidden: false
                        icon:
                          name: "badge"
                        label: "Identity"
                        name: "identity"
                        tier: "T1"
                      usesVariants: false
              schema:
                $ref: "#/components/schemas/TableMetaDataResponseV1"
          description: "The full table metadata"
      security:
      - sessionUuidCookie:
        - "N/A"
      summary: "Get table metaData"
      tags:
      - "Tables"
  /qqq/v1/table/{tableName}/query:
    post:
      description: "Execute a query against a table, returning records that match\
        \ a filter."
      parameters:
      - description: "Name of the table to query."
        example: "person"
        in: "path"
        name: "tableName"
        required: true
        schema:
          type: "string"
      requestBody:
        content:
          application/json:
            schema:
              properties:
                filter:
                  $ref: "#/components/schemas/QueryFilter"
                  description: "QueryFilter to specify matching records to be returned\
                    \ by the query"
                joins:
                  description: "QueryJoin objects to specify tables to be joined into\
                    \ the query"
                  items:
                    $ref: "#/components/schemas/QueryJoin"
                  type: "array"
                tableVariant:
                  $ref: "#/components/schemas/TableVariant"
                  description: "For tables that use variant backends, specification\
                    \ of which variant to use."
              type: "object"
        required: false
      responses:
        200:
          content:
            application/json:
              examples:
                TODO:
                  value:
                    records:
                    - displayValues:
                        id: "17"
                        quantity: "1,000"
                        storeId: "QQQ-Mart"
                      recordLabel: "Item 17"
                      tableName: "item"
                      values:
                        id: 17
                        quantity: 1000
                        storeId: 42
              schema:
                $ref: "#/components/schemas/TableQueryResponseV1"
          description: "The records matching query"
      security:
      - sessionUuidCookie:
        - "N/A"
      summary: "Query for records from a table"
      tags:
      - "Tables"
  /qqq/v1/table/{tableName}/count:
    post:
      description: "Execute a query against a table, returning the number of records\
        \ that match a filter."
      parameters:
      - description: "Name of the table to count."
        example: "person"
        in: "path"
        name: "tableName"
        required: true
        schema:
          type: "string"
      - description: "Whether or not to also return the count distinct records from\
          \ the main table (e.g., in case of a to-many join; by default, do not)."
        example: "true"
        in: "query"
        name: "includeDistinct"
        required: true
        schema:
          type: "boolean"
      requestBody:
        content:
          application/json:
            schema:
              properties:
                filter:
                  $ref: "#/components/schemas/QueryFilter"
                  description: "QueryFilter to specify matching records to be returned\
                    \ by the query"
                joins:
                  description: "QueryJoin objects to specify tables to be joined into\
                    \ the query"
                  items:
                    $ref: "#/components/schemas/QueryJoin"
                  type: "array"
                tableVariant:
                  $ref: "#/components/schemas/TableVariant"
                  description: "For tables that use variant backends, specification\
                    \ of which variant to use."
              type: "object"
        required: false
      responses:
        200:
          content:
            application/json:
              examples:
                TODO:
                  value:
                    count: 42
              schema:
                $ref: "#/components/schemas/TableCountResponseV1"
          description: "The number (count) of records matching the query"
      security:
      - sessionUuidCookie:
        - "N/A"
      summary: "Count records in a table"
      tags:
      - "Tables"
  /qqq/v1/search:
    post:
      description: "Search for records whose search fields (declared per table in\
        \ its meta-data, and listed as `searchFields` in the\ntable meta-data) match\
        \ a search term. String fields match when they contain the term, ignoring\
        \ case; integer\nfields match when they equal a numeric term. Only tables\
        \ that the user has permission to read are searched,\nrecord security locks\
        \ apply, and each table returns at most `limitPerTable` records (default 5,\
        \ maximum 25)."
      requestBody:
        content:
          application/json:
            schema:
              properties:
                searchTerm:
                  description: "Text to search for (required; at most 100 characters\
                    \ after trimming)."
                  example: "Kelkhoff"
                  type: "string"
                tableNames:
                  description: "Optional list of table names to search. When omitted\
                    \ or empty, every table with search fields is searched."
                  items:
                    type: "string"
                  type: "array"
                limitPerTable:
                  description: "Maximum number of records to return from each table."
                  type: "number"
              type: "object"
        required: true
      responses:
        200:
          content:
            application/json:
              examples:
                TODO:
                  value:
                    results:
