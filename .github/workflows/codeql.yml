name: CodeQL Advanced
'on':
  push:
    branches:
    - develop
    - dependabot
    - feature
    - hotfix/*
    - main
    - release/*
  pull_request:
    branches:
    - develop
    - dependabot
    - feature
    - hotfix/*
    - main
    - release/*
  schedule:
  - cron: 41 16 * * 0
permissions:
  security-events: write
  packages: read
  actions: read
  contents: read
jobs:
  analyze:
    uses: QRun-IO/qqq-orb/.github/workflows/core-codeql.yml@bcab95daa80eb4741b7916cd07f4854b5d99eadf
