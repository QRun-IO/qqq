version: 2.1
setup: true
orbs:
  qqq-orb: kingsrook/qqq-orb@0.7.11
workflows:
  setup:
    jobs:
    - qqq-orb/generate_pipeline:
        orb_version: 0.7.11
        filters:
          branches:
            ignore: automation/qbit-rc-pending
          tags:
            only: /.*/
        mongo_bind_diagnostics: << pipeline.parameters.mongo_bind_diagnostics >>
        next_acceptance_bundle_url: << pipeline.parameters.next_acceptance_bundle_url
          >>
        next_acceptance_bundle_sha256: << pipeline.parameters.next_acceptance_bundle_sha256
          >>
        next_acceptance_receipt_sha256: << pipeline.parameters.next_acceptance_receipt_sha256
          >>
parameters:
  mongo_bind_diagnostics:
    type: boolean
    default: false
  next_acceptance_bundle_url:
    type: string
    default: ''
  next_acceptance_bundle_sha256:
    type: string
    default: ''
  next_acceptance_receipt_sha256:
    type: string
    default: ''
